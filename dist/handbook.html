<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handbook IaC — Terraform na AWS e no GCP</title>
<meta name="description" content="Handbook interativo de Infraestrutura como Código com Terraform: do ClickOps ao código, com laboratório simulado de AWS e GCP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b42bc'/%3E%3Cpath d='M13 8l6 3.5v7L13 15V8z' fill='%23fff'/%3E%3Cpath d='M20 12l6 3.5v7l-6-3.5v-7z' fill='%23fff' opacity='.6'/%3E%3Cpath d='M13 16.5l6 3.5v7l-6-3.5v-7z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">

<style>
/* =========================================================
   Handbook IaC — design system
   ========================================================= */
:root{
  --bg:#0e1117;
  --bg-2:#141a22;
  --bg-3:#1a212b;
  --panel:#151b24;
  --panel-2:#1b2330;
  --line:#242e3c;
  --line-soft:#1e2632;
  --tx:#dfe6ef;
  --tx-2:#9aa8ba;
  --tx-3:#6b7a8d;
  --acc:#7b42bc;           /* terraform */
  --acc-2:#a970e8;
  --aws:#ff9900;
  --gcp:#4285f4;
  --ok:#3fb950;
  --warn:#d29922;
  --err:#f85149;
  --info:#58a6ff;
  --cyan:#39c5cf;
  --pink:#db61a2;
  --radius:12px;
  --radius-sm:8px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sidebar-w:274px;
}
/* Se a página abrir sem escolha explícita, respeita o sistema. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f6f8fb; --bg-2:#eef2f7; --bg-3:#e6ecf4;
    --panel:#ffffff; --panel-2:#f4f7fb;
    --line:#dde5ef; --line-soft:#e8eef6;
    --tx:#1a2230; --tx-2:#54637a; --tx-3:#8494a8;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --info:#0969da;
    --shadow:0 10px 30px rgba(20,40,80,.10);
  }
}
html[data-theme="light"]{
  --bg:#f6f8fb;
  --bg-2:#eef2f7;
  --bg-3:#e6ecf4;
  --panel:#ffffff;
  --panel-2:#f4f7fb;
  --line:#dde5ef;
  --line-soft:#e8eef6;
  --tx:#1a2230;
  --tx-2:#54637a;
  --tx-3:#8494a8;
  --ok:#1a7f37;
  --warn:#9a6700;
  --err:#cf222e;
  --info:#0969da;
  --shadow:0 10px 30px rgba(20,40,80,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none !important}
.spacer{flex:1}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:none;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-width:0;padding:26px 34px 90px;outline:none}
.view.wide{padding:18px 20px 60px}

/* ---------- brand ---------- */
.brand{display:flex;gap:11px;align-items:center;padding:16px 16px 12px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--acc),#4b2a80);
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(123,66,188,.35)}
.brand-mark svg{width:24px;height:24px}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:14.5px;letter-spacing:.2px}
.brand-text span{font-size:11px;color:var(--tx-3);letter-spacing:.6px;text-transform:uppercase}

/* ---------- search ---------- */
.side-search{position:relative;margin:2px 12px 10px}
.side-search .ico{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--tx-3)}
.side-search input{
  width:100%;padding:8px 10px 8px 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-3);color:var(--tx);font-size:12.5px;font-family:var(--sans);
}
.side-search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(123,66,188,.16)}

/* ---------- nav ---------- */
.nav{flex:1;overflow-y:auto;padding:0 8px 14px;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.nav-sec{margin-bottom:4px}
.nav-sec-h{
  display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;
  color:var(--tx-2);font:600 11px/1 var(--sans);letter-spacing:.9px;text-transform:uppercase;
  padding:11px 8px 7px;font-family:var(--sans);
}
.nav-sec-h .chev{margin-left:auto;transition:transform .18s;width:14px;height:14px;opacity:.6}
.nav-sec.collapsed .chev{transform:rotate(-90deg)}
.nav-sec.collapsed .nav-items{display:none}
.nav-sec-h .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.nav-sec[data-cloud="aws"] .dot{background:var(--aws)}
.nav-sec[data-cloud="gcp"] .dot{background:var(--gcp)}
.nav-items{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px 6px 24px;border-radius:7px;
  color:var(--tx-2);font-size:13px;cursor:pointer;border:0;background:none;text-align:left;
  width:100%;font-family:var(--sans);position:relative;
}
.nav-item:hover{background:var(--bg-3);color:var(--tx);text-decoration:none}
.nav-item.active{background:rgba(123,66,188,.16);color:var(--tx);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:3px;height:15px;border-radius:3px;background:var(--acc)}
.nav-item .tick{margin-left:auto;color:var(--ok);opacity:0;width:14px;height:14px}
.nav-item.done .tick{opacity:1}
.nav-item .tag{margin-left:auto;font-size:9.5px;letter-spacing:.5px;padding:2px 6px;border-radius:20px;
  background:var(--bg-3);color:var(--tx-3);text-transform:uppercase;font-weight:700}
.nav-item .tag.lab{background:rgba(63,185,80,.14);color:var(--ok)}

.side-foot{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.side-foot-row{display:flex;gap:6px}

/* crédito de autoria */
.author{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg-3);color:var(--tx-2);
  transition:border-color .15s,background .15s;
}
.author:hover{border-color:#0a66c2;background:color-mix(in srgb,#0a66c2 10%,var(--bg-3));text-decoration:none}
.author .ava{
  width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--acc),#4b2a80);color:#fff;
  font:700 10.5px/1 var(--sans);letter-spacing:.5px;
}
.author .au-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.author .au-name{font-size:12.5px;font-weight:650;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.author .au-role{font-size:10px;color:var(--tx-3);letter-spacing:.5px;text-transform:uppercase}
.author .li{width:15px;height:15px;margin-left:auto;flex:none;fill:#0a66c2;stroke:none}
.author:hover .li{fill:#0a66c2}

/* assinatura na página de abertura */
.byline{display:flex;margin:0 0 22px}
.byline a{
  display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--tx-2);
  transition:border-color .15s,transform .15s;
}
.byline a:hover{border-color:#0a66c2;transform:translateY(-1px);text-decoration:none}
.byline .ava{
  width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--acc),#4b2a80);color:#fff;
  font:700 14px/1 var(--sans);letter-spacing:.5px;
}
.byline .bl-name{font-size:14px;font-weight:650;color:var(--tx);display:block;line-height:1.3}
.byline .bl-sub{font-size:12px;color:var(--tx-3);display:block}
.byline .li{width:19px;height:19px;flex:none;fill:#0a66c2;stroke:none;margin-left:6px}
.ghost-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg-3);color:var(--tx-2);cursor:pointer;font-size:12px;
  font-family:var(--sans);
}
.ghost-btn:hover{color:var(--tx);border-color:var(--acc)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.crumb{font-size:12.5px;color:var(--tx-3);display:flex;gap:7px;align-items:center;min-width:0}
.crumb b{color:var(--tx-2);font-weight:600}
.crumb .sep{opacity:.45}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--tx-2);display:grid;place-items:center;cursor:pointer;flex:none;
}
.icon-btn:hover{color:var(--tx);border-color:var(--acc);text-decoration:none}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.only-mobile{display:none}
.progress-pill{
  font-size:11px;color:var(--tx-3);padding:4px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel);white-space:nowrap;
}

/* ---------- typography ---------- */
.page{max-width:940px}
.page.full{max-width:none}
h1{font-size:29px;line-height:1.25;margin:6px 0 8px;letter-spacing:-.4px}
h2{font-size:20px;margin:34px 0 10px;padding-top:8px;letter-spacing:-.2px;scroll-margin-top:70px}
h3{font-size:16px;margin:22px 0 8px;color:var(--tx)}
h4{font-size:14px;margin:16px 0 6px;color:var(--tx-2);text-transform:uppercase;letter-spacing:.7px}
p{margin:10px 0}
.lede{font-size:16.5px;color:var(--tx-2);margin:0 0 18px;line-height:1.7}
ul,ol{margin:10px 0;padding-left:22px}
li{margin:5px 0}
li::marker{color:var(--tx-3)}
strong{color:var(--tx);font-weight:650}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
code{font-family:var(--mono);font-size:.875em;background:var(--bg-3);padding:1.5px 5px;border-radius:5px;
  border:1px solid var(--line-soft);color:var(--acc-2)}
html[data-theme="light"] code{color:#6b32a8}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--tx-2)}

.eyebrow{font:700 11px/1 var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--acc-2);margin-bottom:10px;display:block}
.eyebrow.aws{color:var(--aws)}
.eyebrow.gcp{color:var(--gcp)}

/* ---------- boxes ---------- */
.box{border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--panel);
  padding:12px 15px;border-radius:var(--radius-sm);margin:16px 0}
.box p:first-child{margin-top:0}.box p:last-child{margin-bottom:0}
.box .bt{font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;display:flex;gap:7px;align-items:center;margin-bottom:5px}
.box.tip{border-left-color:var(--ok)} .box.tip .bt{color:var(--ok)}
.box.warn{border-left-color:var(--warn)} .box.warn .bt{color:var(--warn)}
.box.danger{border-left-color:var(--err)} .box.danger .bt{color:var(--err)}
.box.info{border-left-color:var(--info)} .box.info .bt{color:var(--info)}
.box.console{border-left-color:var(--aws)} .box.console .bt{color:var(--aws)}

.grid{display:grid;gap:12px;margin:16px 0}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px 16px}
.card h3{margin-top:0}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .k{font:700 11px/1 var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--tx-3)}
.card .v{font-size:22px;font-weight:700;margin-top:4px}

table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--panel-2);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx-2);white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 55%,transparent)}
td code{white-space:nowrap}

/* ---------- code ---------- */
.code{margin:16px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg-2)}
.code-h{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.code-h .fn{font:600 11.5px/1 var(--mono);color:var(--tx-2)}
.code-h .lang{font:700 9.5px/1 var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--tx-3);
  border:1px solid var(--line);padding:3px 6px;border-radius:5px}
.code-h .cbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--tx-3);cursor:pointer;
  font-size:11px;padding:3px 9px;border-radius:6px;display:flex;gap:5px;align-items:center;font-family:var(--sans)}
.code-h .cbtn:hover{color:var(--tx);border-color:var(--acc)}
.code pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:12.6px;line-height:1.62}
.code pre::-webkit-scrollbar{height:9px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.t-kw{color:#ff7b72}.t-blk{color:#d2a8ff;font-weight:600}.t-str{color:#a5d6ff}
.t-num{color:#79c0ff}.t-com{color:#6b7a8d;font-style:italic}.t-fn{color:#d2a8ff}
.t-attr{color:#79c0ff}.t-ref{color:#7ee787}.t-intp{color:#ffa657}.t-bool{color:#ff7b72}
.t-op{color:var(--tx-2)}
html[data-theme="light"] .t-kw{color:#cf222e}
html[data-theme="light"] .t-blk{color:#8250df}
html[data-theme="light"] .t-str{color:#0a3069}
html[data-theme="light"] .t-num{color:#0550ae}
html[data-theme="light"] .t-fn{color:#8250df}
html[data-theme="light"] .t-attr{color:#0550ae}
html[data-theme="light"] .t-ref{color:#116329}
html[data-theme="light"] .t-intp{color:#953800}

/* console-ish output */
.term-out{font-family:var(--mono);font-size:12.4px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.o-add{color:var(--ok)}.o-del{color:var(--err)}.o-chg{color:var(--warn)}.o-dim{color:var(--tx-3)}
.o-b{color:var(--tx);font-weight:600}.o-hl{color:var(--acc-2)}.o-cy{color:var(--cyan)}

/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.lab-side{position:sticky;top:62px;max-height:calc(100vh - 78px);display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.lab-side-h{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
  font:700 11px/1 var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--tx-2)}
.lab-side-body{overflow-y:auto;padding:8px;scrollbar-width:thin}
.lab-side-body::-webkit-scrollbar{width:8px}
.lab-side-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.cat{margin-bottom:6px}
.cat-h{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;cursor:pointer;color:var(--tx-2);
  font:600 11px/1 var(--sans);letter-spacing:.7px;text-transform:uppercase;padding:8px 6px;font-family:var(--sans)}
.cat-h .chev{margin-left:auto;width:13px;height:13px;transition:transform .18s;opacity:.6}
.cat.collapsed .chev{transform:rotate(-90deg)}
.cat.collapsed .cat-items{display:none}
.cat-items{display:flex;flex-direction:column;gap:3px}
.res{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;background:none;text-align:left;width:100%;font-family:var(--sans);color:var(--tx-2)}
.res:hover{background:var(--bg-3);border-color:var(--line);color:var(--tx)}
.res .em{font-size:14px;line-height:1.2;width:18px;text-align:center;flex:none}
.res .rn{font-size:12.5px;font-weight:600;color:var(--tx);display:block;line-height:1.3}
.res .rt{font-size:10.5px;color:var(--tx-3);font-family:var(--mono);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .plus{margin-left:auto;color:var(--tx-3);font-size:15px;flex:none;line-height:1}
.res.in .plus{color:var(--ok)}
.res.in{background:rgba(63,185,80,.08)}

.lab-main{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;min-width:0}
.lab-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);
  overflow-x:auto;scrollbar-width:none}
.lab-tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:7px;border:0;background:none;color:var(--tx-3);cursor:pointer;
  font:600 12.5px/1.4 var(--sans);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--tx);background:var(--bg-3)}
.tab.active{background:var(--acc);color:#fff}
.tab .badge{background:rgba(255,255,255,.16);border-radius:20px;padding:1px 6px;font-size:10px}
.tab.active .badge{background:rgba(0,0,0,.22)}
.lab-body{padding:14px 16px;min-height:420px}
.lab-body.pad0{padding:0}

.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel-2);color:var(--tx);font:600 12.5px/1 var(--sans);
}
.btn:hover{border-color:var(--acc);text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04240c}
.btn.dgr{background:transparent;border-color:var(--err);color:var(--err)}
.btn.dgr:hover{background:rgba(248,81,73,.1)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:4px 9px;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;
  border:1px solid var(--line);background:var(--bg-3);color:var(--tx-2);font-weight:600}
.chip.ok{color:var(--ok);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.1)}
.chip.warn{color:var(--warn);border-color:rgba(210,153,34,.4);background:rgba(210,153,34,.1)}
.chip.err{color:var(--err);border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.1)}
.chip.info{color:var(--info);border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.1)}
.chip.acc{color:var(--acc-2);border-color:rgba(123,66,188,.45);background:rgba(123,66,188,.12)}

/* item list in project */
.pitem{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg-2);margin-bottom:6px;cursor:pointer}
.pitem:hover{border-color:var(--acc)}
.pitem.sel{border-color:var(--acc);background:rgba(123,66,188,.09)}
.pitem .em{font-size:16px}
.pitem .nm{font-weight:600;font-size:13px}
.pitem .sub{font-size:11px;color:var(--tx-3);font-family:var(--mono)}
.pitem .del{margin-left:auto;background:none;border:0;color:var(--tx-3);cursor:pointer;font-size:16px;padding:0 4px}
.pitem .del:hover{color:var(--err)}
.pitem .cnt{font-size:10.5px;color:var(--tx-3);border:1px solid var(--line);border-radius:20px;padding:1px 7px}

.form-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:9px}
.form-row label{font-size:12.5px;color:var(--tx-2)}
.form-row .hint{font-size:11px;color:var(--tx-3);grid-column:2}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg-3);
  color:var(--tx);font-size:12.5px;font-family:var(--mono);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
select{font-family:var(--sans)}

/* diagram */
.diagram-wrap{overflow:auto;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--bg-2);
  border-radius:var(--radius);border:1px solid var(--line)}
.diagram-wrap svg{display:block}
.node-box{cursor:pointer}
.node-box:hover rect{stroke-width:2}

/* terminal */
.term{background:#0b0f14;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;height:520px}
html[data-theme="light"] .term{background:#0d1117}
.term-h{display:flex;gap:7px;align-items:center;padding:8px 12px;background:#11161d;border-bottom:1px solid #222c38}
.term-h .dot{width:11px;height:11px;border-radius:50%}
.term-h .t{margin-left:8px;font:600 11.5px/1 var(--mono);color:#7d8b9e}
.term-scroll{flex:1;overflow-y:auto;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#c9d4e2}
.term-scroll::-webkit-scrollbar{width:9px}
.term-scroll::-webkit-scrollbar-thumb{background:#263140;border-radius:8px}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-in{display:flex;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid #222c38;background:#0d1218}
.term-in span{color:#7ee787;font-family:var(--mono);font-size:12.5px;flex:none}
.term-in input{background:none;border:0;color:#e5edf6;font-family:var(--mono);font-size:12.5px;flex:1;padding:0}
.term-in input:focus{outline:none}
.cursor-blink{display:inline-block;width:8px;height:14px;background:#7ee787;vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* checks / lint */
.lint{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--bg-2)}
.lint .sev{font:700 9.5px/1 var(--sans);letter-spacing:.7px;text-transform:uppercase;padding:4px 7px;border-radius:5px;height:fit-content;flex:none}
.lint.err .sev{background:rgba(248,81,73,.16);color:var(--err)}
.lint.warn .sev{background:rgba(210,153,34,.16);color:var(--warn)}
.lint.info .sev{background:rgba(88,166,255,.16);color:var(--info)}
.lint.ok .sev{background:rgba(63,185,80,.16);color:var(--ok)}
.lint .msg{font-size:13px}
.lint .fix{font-size:12px;color:var(--tx-3);margin-top:4px}

/* steps / scenario */
.step{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.step.done{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.06)}
.step.cur{border-color:var(--acc);box-shadow:0 0 0 3px rgba(123,66,188,.12)}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font:700 11px/1 var(--mono);color:var(--tx-3);flex:none;background:var(--bg-3)}
.step.done .n{background:var(--ok);color:#04240c;border-color:var(--ok)}
.step.cur .n{background:var(--acc);color:#fff;border-color:var(--acc)}
.step .t{font-weight:650;font-size:13.5px}
.step .d{font-size:12.5px;color:var(--tx-2);margin-top:2px}

.bar{height:6px;border-radius:6px;background:var(--bg-3);overflow:hidden;margin:8px 0 14px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-2));transition:width .4s}

/* quiz */
.qz{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:var(--panel)}
.qz .qt{font-weight:650;margin-bottom:9px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;cursor:pointer;font-size:13px;background:var(--bg-2)}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:rgba(63,185,80,.1)}
.opt.wrong{border-color:var(--err);background:rgba(248,81,73,.1)}
.opt .mk{font-family:var(--mono);color:var(--tx-3);flex:none}
.qz .expl{margin-top:8px;font-size:12.5px;color:var(--tx-2);border-left:2px solid var(--acc);padding-left:10px}

/* toast + palette */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel);border:1px solid var(--acc);color:var(--tx);padding:9px 16px;border-radius:9px;
  box-shadow:var(--shadow);font-size:13px;pointer-events:none;transition:.22s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.palette{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;justify-content:center;padding-top:14vh}
.palette-box{width:min(620px,92vw);height:fit-content;max-height:64vh;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.palette-box input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 16px;font-size:14.5px;font-family:var(--sans);background:none}
.palette-list{overflow-y:auto}
.presult{display:flex;gap:9px;align-items:center;padding:9px 16px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-soft)}
.presult:hover,.presult.sel{background:var(--bg-3)}
.presult .sec{margin-left:auto;font-size:10.5px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.6px}
.presult .snip{display:block;font-size:11.5px;color:var(--tx-3)}

/* misc */
.pager{display:flex;gap:10px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--panel);color:var(--tx)}
.pager a:hover{border-color:var(--acc);text-decoration:none}
.pager .k{font-size:10.5px;color:var(--tx-3);letter-spacing:.7px;text-transform:uppercase}
.pager .n{font-weight:650;font-size:13.5px}
.pager .r{text-align:right}
.tocx{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 22px}
.tocx a{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--tx-2);background:var(--panel)}
.tocx a:hover{border-color:var(--acc);color:var(--tx);text-decoration:none}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mark-done{display:flex;align-items:center;gap:9px;margin-top:26px;padding:12px 15px;border:1px dashed var(--line);
  border-radius:10px;background:var(--panel);cursor:pointer}
.mark-done:hover{border-color:var(--ok)}
.mark-done.done{border-style:solid;border-color:var(--ok);background:rgba(63,185,80,.07)}
.kv{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.kv b{min-width:150px;color:var(--tx-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--tx-3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{text-align:center;padding:52px 20px;color:var(--tx-3)}
.empty .big{font-size:36px;margin-bottom:8px}

@media (max-width:1180px){ .lab{grid-template-columns:255px minmax(0,1fr)} }
@media (max-width:980px){
  .sidebar{position:fixed;z-index:100;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .only-mobile{display:grid}
  .view{padding:18px 16px 70px}
  .lab{grid-template-columns:1fr}
  .lab-side{position:static;max-height:340px}
  .grid.c3,.grid.c4,.grid.c2,.split{grid-template-columns:1fr}
}
@media print{ .sidebar,.topbar,.pager{display:none} .view{padding:0} }

<script>
/* ===== assets/js/core.js ===== */
/* =========================================================
   core.js — utilidades, highlighter, storage, registry
   ========================================================= */
window.IAC = window.IAC || {};
(function (IAC) {
  'use strict';

  /* ---------- DOM ---------- */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  function h(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  /* ---------- storage (tolerante a file:// e Safari) ---------- */
  const mem = {};
  const store = {
    get(k, def) {
      try { const v = localStorage.getItem('iac.' + k); return v == null ? def : JSON.parse(v); }
      catch (e) { return k in mem ? mem[k] : def; }
    },
    set(k, v) {
      try { localStorage.setItem('iac.' + k, JSON.stringify(v)); } catch (e) { mem[k] = v; }
      return v;
    },
    del(k) { try { localStorage.removeItem('iac.' + k); } catch (e) { delete mem[k]; } }
  };

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg) {
    const t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2100);
  }
  function copy(text, label) {
    const done = () => toast((label || 'Copiado') + ' ✓');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } else fallback();
    function fallback() {
      const ta = h('textarea'); ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Não consegui copiar'); }
      document.body.removeChild(ta);
    }
  }

  /* ---------- syntax highlight ---------- */
  const HCL_BLOCK = /^(resource|data|module|variable|output|locals|provider|terraform|backend|required_providers|check|import|moved|removed|run|dynamic|lifecycle|connection|provisioner)$/;
  const HCL_KW = /^(for|in|if|else|endif|endfor|null|true|false|depends_on|count|for_each|source|version|providers|sensitive|type|default|description|validation|precondition|postcondition)$/;

  function hl(code, lang) {
    lang = lang || 'hcl';
    if (lang === 'bash' || lang === 'sh') return hlBash(code);
    if (lang === 'json') return hlJson(code);
    if (lang === 'yaml' || lang === 'yml') return hlYaml(code);
    if (lang === 'text' || lang === 'plain') return esc(code);
    return hlHcl(code);
  }

  function hlHcl(code) {
    const RE = new RegExp([
      '(#[^\\n]*|//[^\\n]*)',                                  // 1 comment
      '(&quot;(?:[^&\\n]|&(?!quot;))*&quot;)',                     // 2 string (aspas já escapadas)
      '\\b([a-z_][a-z0-9_]*)\\s*(?=\\()',                      // 3 function
      '\\b(true|false|null)\\b',                               // 4 bool
      '\\b(\\d+(?:\\.\\d+)?)\\b',                              // 5 number
      '^\\s*([a-z_][a-z0-9_]*)(?=\\s+&quot;|\\s*\\{)',              // 6 block head
      '\\b((?:aws|google|azurerm|random|tls|null|local|archive|kubernetes|helm)_[a-z0-9_]+)\\.([A-Za-z_][\\w-]*)', // 7,8 ref
      '\\b(var|local|module|data|each|count|path|terraform|self)\\.([A-Za-z_][\\w-]*)', // 9,10 ref2
      '^\\s*([A-Za-z_][\\w-]*)(?=\\s*=[^=])'                   // 11 attribute
    ].join('|'), 'gm');
    return esc(code).replace(RE, function (m, com, str, fn, bool, num, blk, r1, r2, v1, v2, attr) {
      if (com) return '<span class="t-com">' + m + '</span>';
      if (str) {
        const inner = str.replace(/\$\{[^}]*\}/g, x => '<span class="t-intp">' + x + '</span>');
        return '<span class="t-str">' + inner + '</span>';
      }
      if (fn) return '<span class="t-fn">' + m + '</span>';
      if (bool) return '<span class="t-bool">' + m + '</span>';
      if (num) return '<span class="t-num">' + m + '</span>';
      if (blk) return m.replace(blk, (HCL_BLOCK.test(blk) ? '<span class="t-kw">' : '<span class="t-blk">') + blk + '</span>');
      if (r1) return '<span class="t-ref">' + m + '</span>';
      if (v1) return '<span class="t-ref">' + m + '</span>';
      if (attr) return m.replace(attr, '<span class="t-attr">' + attr + '</span>');
      return m;
    });
  }
  function hlBash(code) {
    return esc(code)
      .replace(/^(\s*)(#[^\n]*)$/gm, '$1<span class="t-com">$2</span>')
      .replace(/(&quot;(?:[^&]|&(?!quot;))*&quot;|'[^']*')/g, '<span class="t-str">$1</span>')
      .replace(/^(\s*)\$ /gm, '$1<span class="t-com">$ </span>')
      .replace(/\b(terraform|tflint|tfsec|checkov|terragrunt|aws|gcloud|docker|git|export|cd|make|curl|jq|infracost|atmos|kubectl)\b/g, '<span class="t-kw">$1</span>')
      .replace(/(\s)(-{1,2}[a-zA-Z][\w-]*)/g, '$1<span class="t-num">$2</span>');
  }
  function hlJson(code) {
    return esc(code)
      .replace(/(&quot;(?:[^&]|&(?!quot;))*&quot;)(\s*:)/g, '<span class="t-attr">$1</span>$2')
      .replace(/:\s*(&quot;(?:[^&]|&(?!quot;))*&quot;)/g, ': <span class="t-str">$1</span>')
      .replace(/\b(true|false|null)\b/g, '<span class="t-bool">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="t-num">$1</span>');
  }
  function hlYaml(code) {
    return esc(code)
      .replace(/^(\s*)(#[^\n]*)$/gm, '$1<span class="t-com">$2</span>')
      .replace(/^(\s*-?\s*)([\w.\/-]+)(:)/gm, '$1<span class="t-attr">$2</span>$3')
      .replace(/\$\{\{[^}]*\}\}/g, m => '<span class="t-intp">' + m + '</span>');
  }

  let cbId = 0;
  const CODE_CACHE = {};
  /** Bloco de código com header + botão copiar. */
  function code(src, opts) {
    opts = opts || {};
    const lang = opts.lang || 'hcl';
    const id = 'cb' + (++cbId);
    CODE_CACHE[id] = src;
    const file = opts.file ? '<span class="fn">' + esc(opts.file) + '</span>' : '';
    return '<div class="code"><div class="code-h">' + file +
      '<span class="lang">' + esc(lang) + '</span>' +
      '<button class="cbtn" data-copy="' + id + '">' +
      '<svg viewBox="0 0 24 24" class="ico" style="width:13px;height:13px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>copiar</button>' +
      '</div><pre><code>' + hl(src, lang) + '</code></pre></div>';
  }
  function getCode(id) { return CODE_CACHE[id]; }

  /* ---------- helpers de conteúdo ---------- */
  function box(kind, title, html) {
    const ics = {
      tip: 'M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z',
      warn: 'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z',
      danger: 'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z',
      info: 'M12 16v-4M12 8h.01M12 22a10 10 0 100-20 10 10 0 000 20z',
      console: 'M4 17l6-5-6-5M12 19h8'
    };
    return '<div class="box ' + kind + '"><div class="bt">' +
      '<svg viewBox="0 0 24 24" class="ico" style="width:15px;height:15px"><path d="' + (ics[kind] || ics.info) + '"/></svg>' +
      esc(title) + '</div>' + html + '</div>';
  }
  const tip = (t, h) => box('tip', t || 'Boa prática', h);
  const warn = (t, h) => box('warn', t || 'Atenção', h);
  const danger = (t, h) => box('danger', t || 'Cuidado', h);

      "logs:CreateLogStream",

    ]

    resources = ["arn:aws:logs:*:*:log-group:/\${var.project}/*"]
  }
`;
      return `# ---- Politica de CONFIANCA: quem pode vestir esta role ----

  statement {
    actions = ["sts:AssumeRole"]

    principals {
      type        = "Service"

    }
  }
}

resource "aws_iam_role" "${n}" {

}

# ---- Politica de PERMISSAO: o que a role pode fazer ----
data "aws_iam_policy_document" "${n}" {
${stmts}}

resource "aws_iam_policy" "${n}" {
  name        = "\${local.name}-${n}"
  description = "Permissoes minimas de \${local.name}"
  policy      = data.aws_iam_policy_document.${n}.json
}

resource "aws_iam_role_policy_attachment" "${n}" {
  role       = aws_iam_role.${n}.name
  policy_arn = aws_iam_policy.${n}.arn
}
${c.ssm ? `

REPO=$(terraform output -raw ecr_${c._n}_url)

# 2) login no registry (a senha é um token temporário)
aws ecr get-login-password --region us-east-1 \\
  | docker login --username AWS --password-stdin "\${REPO%%/*}"

# 3) build e push usando o SHA do commit como tag (nunca "latest")
TAG=$(git rev-parse --short HEAD)

resource "aws_ecs_cluster_capacity_providers" "main" {

  C({
    id: 'ecs_task', cat: 'cont', name: 'Task Definition (imagem + secrets)', em: '📄',
    tf: 'aws_ecs_task_definition', multi: false, cost: 0,
    desc: 'A definição do contêiner: qual imagem do ECR, quanto de CPU/memória, quais variáveis vêm do Secrets Manager e para onde vão os logs.',
    console: [
      'ECS → Task definitions → Create new task definition',

    ],
    file: 'ecs.tf',
    hcl: (c, ctx) => {
      const ecr = ctx.nameOf('ecr') || 'app';

      return `# Role que o ECS usa para PUXAR a imagem e LER o secret.
data "aws_iam_policy_document" "ecs_exec_assume" {
  statement {
    actions = ["sts:AssumeRole"]

    principals {
      type        = "Service"
      identifiers = ["ecs-tasks.amazonaws.com"]
    }
  }
}

resource "aws_iam_role" "ecs_execution" {
  name               = "\${local.name}-ecs-exec"
  assume_role_policy = data.aws_iam_policy_document.ecs_exec_assume.json
}

resource "aws_iam_role_policy_attachment" "ecs_execution" {
  role       = aws_iam_role.ecs_execution.name
  policy_arn = "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
}
${sec ? `
data "aws_iam_policy_document" "ecs_exec_secrets" {
  statement {
    actions   = ["secretsmanager:GetSecretValue"]
    resources = [aws_secretsmanager_secret.${sec}.arn]
  }
}

resource "aws_iam_role_policy" "ecs_exec_secrets" {
  name   = "ler-secrets"
  role   = aws_iam_role.ecs_execution.id
  policy = data.aws_iam_policy_document.ecs_exec_secrets.json
}
` : ''}
resource "aws_ecs_task_definition" "app" {
  family                   = "\${local.name}"
  requires_compatibilities = ["FARGATE"]
  network_mode             = "awsvpc"
  cpu                      = "${c.cpu}"
  memory                   = "${c.mem}"
  execution_role_arn       = aws_iam_role.ecs_execution.arn
${ctx.has('iam_role') ? `  task_role_arn            = aws_iam_role.${ctx.nameOf('iam_role')}.arn\n` : ''}
  container_definitions = jsonencode([
    {
      name      = "app"
      image     = "\${aws_ecr_repository.${ecr}.repository_url}:\${var.image_tag}"
      essential = true

      portMappings = [
        {
          containerPort = ${c.port}
          protocol      = "tcp"
        },
      ]
${sec ? `
      # Injeta APENAS o campo DB_PASSWORD do JSON do secret.
      secrets = [
        {
          name      = "DB_PASSWORD"
          valueFrom = "\${aws_secretsmanager_secret.${sec}.arn}:DB_PASSWORD::"
        },
      ]
` : ''}
      environment = [
        {
          name  = "APP_ENV"
          value = var.env
        },
      ]

      logConfiguration = {
        logDriver = "awslogs"

        options = {
          "awslogs-group"         = ${ctx.has('logs') ? 'aws_cloudwatch_log_group.app.name' : '"/ecs/\\${local.name}"'}
          "awslogs-region"        = var.region
          "awslogs-stream-prefix" = "app"
        }
      }

      healthCheck = {
        command  = ["CMD-SHELL", "curl -f http://localhost:${c.port}/health || exit 1"]
        interval = 30
        timeout  = 5
        retries  = 3
      }
    },
  ])

  tags = {
    Name = "\${local.name}-task"
  }
}

variable "image_tag" {
  type        = string
  description = "Tag da imagem — passe o SHA do commit pela pipeline"
  default     = "latest"
}`;
    }
  });

  C({
    id: 'ecs_service', cat: 'cont', name: 'ECS Service + autoscaling', em: '🚢',
    tf: 'aws_ecs_service', multi: false, cost: 25,
    desc: 'Mantém N tarefas rodando, registra cada uma no Target Group e faz deploy sem downtime com circuit breaker e rollback automático.',

      '<code>ignore_changes = [desired_count]</code> quando o autoscaling gerencia a quantidade.',

    inputs: [
      { k: 'count', l: 'Tarefas desejadas', t: 'num', v: 2, min: 1, max: 20 },
      { k: 'min', l: 'Mín (autoscaling)', t: 'num', v: 2, min: 1, max: 20 },
      { k: 'max', l: 'Máx (autoscaling)', t: 'num', v: 10, min: 1, max: 100 },
      { k: 'port', l: 'Porta do contêiner', t: 'num', v: 8080 }
    ],
    file: 'ecs.tf',
    hcl: (c, ctx) => `resource "aws_ecs_service" "app" {
  name            = "\${local.name}"
  cluster         = aws_ecs_cluster.main.id
  task_definition = aws_ecs_task_definition.app.arn
  desired_count   = ${c.count}

  network_configuration {
    subnets          = ${ctx.privSubnets()}
    security_groups  = [${ctx.sgRef('app')}]
    assign_public_ip = false
  }

  # >>> O "vincular ao Target Group", versao ECS <<<
  load_balancer {

    container_name   = "app"
    container_port   = ${c.port}
  }

  deployment_maximum_percent         = 200
  deployment_minimum_healthy_percent = 100

  # Deploy quebrado volta sozinho.
  deployment_circuit_breaker {
    enable   = true
    rollback = true
  }

  # Permite "docker exec" via SSM, sem bastion.
  enable_execute_command = true

  depends_on = [aws_lb_listener.https]

  lifecycle {
    ignore_changes = [desired_count]
  }

  tags = {
    Name = "\${local.name}-svc"
  }
}

# --- Autoscaling do ECS usa Application Auto Scaling ---
resource "aws_appautoscaling_target" "ecs" {

  resource_id        = "service/\${aws_ecs_cluster.main.name}/\${aws_ecs_service.app.name}"

  min_capacity       = ${c.min}
  max_capacity       = ${c.max}
}

      predefined_metric_type = "ECSServiceAverageCPUUtilization"

  }
}`

  source_dir  = "\${path.module}/src"

}

resource "aws_lambda_function" "api" {
  function_name = "\${local.name}-api"
  role          = aws_iam_role.${ctx.nameOf('iam_role') || 'lambda'}.arn
  handler       = "main.handler"
  runtime       = "${c.runtime}"

    }
  }

  tags = {
    Name = "\${local.name}-api"
  }
}

  C({

    gotchas: [

      'MIG regional distribui pelas 3 zonas automaticamente — HA de graça, sem <code>count</code> por AZ.',
      '<code>update_policy</code> com <code>type = "PROACTIVE"</code> é o rolling update; sem isso, mudar o template não troca nada.',
      '<code>max_surge_fixed</code> precisa ser múltiplo do número de zonas em MIG regional.',
      'Autoscaler é um recurso <b>separado</b> que aponta para o MIG.'
    ],
    inputs: [
      { k: 'min', l: 'Mínimo', t: 'num', v: 2, min: 0, max: 20 },
      { k: 'max', l: 'Máximo', t: 'num', v: 6, min: 1, max: 50 },
      { k: 'cpu', l: 'CPU alvo (0-1)', t: 'text', v: '0.6' },
      { k: 'port', l: 'Porta da app', t: 'num', v: 8080 }
    ],
    file: 'compute.tf',
    hcl: (c) => `resource "google_compute_region_instance_group_manager" "app" {
  name               = "\${local.name}-mig"
  region             = var.region
  base_instance_name = local.name

  version {
    instance_template = google_compute_instance_template.app.id
  }

  # >>> O "named port" e o que liga o MIG ao backend service <<<
  named_port {
    name = "http"
    port = ${c.port}
  }

  auto_healing_policies {
    health_check      = google_compute_health_check.app.id
    initial_delay_sec = 120
  }

  # Rolling update nativo (equivale ao instance_refresh do ASG).
  update_policy {
    type                         = "PROACTIVE"
    minimal_action               = "REPLACE"
    instance_redistribution_type = "PROACTIVE"
    max_surge_fixed              = 3
    max_unavailable_fixed        = 0
  }
}

resource "google_compute_region_autoscaler" "app" {
  name   = "\${local.name}-autoscaler"
  region = var.region
  target = google_compute_region_instance_group_manager.app.id

  autoscaling_policy {
    min_replicas    = ${c.min}
    max_replicas    = ${c.max}
    cooldown_period = 120

    cpu_utilization {
      target = ${c.cpu}
    }
  }
}`
  });

  C({
    id: 'backend_svc', cat: 'lb', name: 'Backend Service', em: '🎯',
    tf: 'google_compute_backend_service', multi: false, cost: 0,
    desc: 'O parente mais próximo do Target Group da AWS — mas ele também carrega CDN, política de segurança e afinidade de sessão.',
    console: ['Network services → Load balancing → Create → Backend configuration → Create backend service → escolher o instance group + health check'],
    gotchas: [
      '<code>load_balancing_scheme</code> precisa combinar em <b>todos</b> os recursos da cadeia. Misturar <code>EXTERNAL</code> com <code>EXTERNAL_MANAGED</code> dá erro obscuro.',
      '<code>port_name</code> precisa bater exatamente com o <code>named_port</code> do MIG.',
      'Habilitar <code>enable_cdn</code> é uma linha — o Cloud CDN vem embutido, sem CloudFront separado.',
      '<code>timeout_sec</code> padrão é 30s: streaming e uploads longos quebram sem ajuste.'
    ],
    inputs: [{ k: 'cdn', l: 'Habilitar Cloud CDN', t: 'bool', v: false }, { k: 'timeout', l: 'Timeout (s)', t: 'num', v: 30 }],
    file: 'lb.tf',
    hcl: (c, ctx) => `resource "google_compute_backend_service" "app" {
  name                  = "\${local.name}-backend"
  protocol              = "HTTP"
  port_name             = "http"
  load_balancing_scheme = "EXTERNAL_MANAGED"
  timeout_sec           = ${c.timeout}
  enable_cdn            = ${c.cdn}

  health_checks = [google_compute_health_check.app.id]

  backend {
    group           = google_compute_region_instance_group_manager.app.instance_group
    balancing_mode  = "UTILIZATION"
    capacity_scaler = 1.0
  }

  log_config {
    enable      = true
    sample_rate = 1.0
  }
${ctx.has('armor') ? '\n  security_policy = google_compute_security_policy.main.id\n' : ''}}`
  });

  C({
    id: 'lb', cat: 'lb', name: 'HTTPS LB global (proxy + IP + cert)', em: '⚖️',
    tf: 'google_compute_global_forwarding_rule', multi: false, cost: 20,
    desc: 'Aqui a diferença para a AWS é grande: o "load balancer" do GCP não é <i>um</i> recurso, são <b>cinco</b> encadeados. Em compensação, o IP é anycast global.',
    console: [
      'Network services → Load balancing → Create load balancer → Application Load Balancer (HTTP/S) → Global',
      'Frontend: reservar IP estático + certificado gerenciado + porta 443',
      'Routing rules: URL map apontando para o backend service',
      'Criar um segundo frontend na porta 80 só para redirecionar'
    ],
    gotchas: [
      'A cadeia é: <b>forwarding rule → target proxy → url map → backend service → MIG</b>. Cada elo é um recurso.',
      'Certificado gerenciado só valida depois que o DNS já aponta para o IP — <b>e pode levar até 60 minutos</b>. Não é bug.',
      'O IP global precisa ser <code>google_compute_global_address</code> (não o regional).',
      'O redirect 80→443 exige um <b>segundo</b> url map + proxy + forwarding rule. Não é uma flag como na AWS.'
    ],
    inputs: [{ k: 'domain', l: 'Domínio', t: 'text', v: 'app.exemplo.com.br' }],
    file: 'lb.tf',
    hcl: (c) => `resource "google_compute_global_address" "main" {
  name = "\${local.name}-ip"
}

resource "google_compute_managed_ssl_certificate" "main" {
  name = "\${local.name}-cert"

  managed {
    domains = ["${c.domain}"]
  }

  lifecycle {
    create_before_destroy = true
  }
}

# 1) URL map: qual caminho vai para qual backend
resource "google_compute_url_map" "main" {
  name            = "\${local.name}-urlmap"
  default_service = google_compute_backend_service.app.id

  host_rule {
    hosts        = ["${c.domain}"]
    path_matcher = "principal"
  }

  path_matcher {
    name            = "principal"
    default_service = google_compute_backend_service.app.id

    path_rule {
      paths   = ["/api/*"]
      service = google_compute_backend_service.app.id
    }
  }
}

# 2) Target proxy: termina o TLS
resource "google_compute_target_https_proxy" "main" {
  name             = "\${local.name}-https-proxy"
  url_map          = google_compute_url_map.main.id
  ssl_certificates = [google_compute_managed_ssl_certificate.main.id]
}

# 3) Forwarding rule: o IP + porta de verdade
resource "google_compute_global_forwarding_rule" "https" {
  name                  = "\${local.name}-https"
  target                = google_compute_target_https_proxy.main.id
  port_range            = "443"
  ip_address            = google_compute_global_address.main.address
  load_balancing_scheme = "EXTERNAL_MANAGED"
}

# --- Redirect 80 -> 443 precisa da cadeia inteira de novo ---
resource "google_compute_url_map" "redirect" {
  name = "\${local.name}-redirect"

  default_url_redirect {
    https_redirect         = true
    redirect_response_code = "MOVED_PERMANENTLY_DEFAULT"
    strip_query            = false
  }
}

resource "google_compute_target_http_proxy" "redirect" {
  name    = "\${local.name}-http-proxy"
  url_map = google_compute_url_map.redirect.id
}

resource "google_compute_global_forwarding_rule" "http" {
  name                  = "\${local.name}-http"
  target                = google_compute_target_http_proxy.redirect.id
  port_range            = "80"
  ip_address            = google_compute_global_address.main.address
  load_balancing_scheme = "EXTERNAL_MANAGED"
}`,
    outputs: () => `output "lb_ip" {
  description = "Aponte seu DNS para este IP"
  value       = google_compute_global_address.main.address
}`
  });

  C({
    id: 'armor', cat: 'lb', name: 'Cloud Armor (WAF)', em: '🧱',
    tf: 'google_compute_security_policy', multi: false, cost: 6,
    desc: 'O WAF do GCP. Regras pré-configuradas contra OWASP e rate limiting por IP, anexadas ao backend service.',
    console: ['Network Security → Cloud Armor policies → Create policy → Add rule → Target: backend service'],
    gotchas: [
      'A regra de prioridade <code>2147483647</code> é a default e <b>tem que existir</b>.',
      'Prioridade menor = avaliada primeiro.',
      'Use <code>preview = true</code> antes de bloquear de verdade.'
    ],
    inputs: [{ k: 'rate', l: 'Limite (req/min por IP)', t: 'num', v: 600 }],
    file: 'armor.tf',
    hcl: (c) => `resource "google_compute_security_policy" "main" {
  name = "\${local.name}-armor"

  rule {
    action      = "allow"
    priority    = 2147483647
    description = "Regra padrao obrigatoria"

    match {
      versioned_expr = "SRC_IPS_V1"

      config {
        src_ip_ranges = ["*"]
      }
    }
  }

  rule {
    action      = "throttle"
    priority    = 1000
    description = "Rate limiting por IP"

    match {
      versioned_expr = "SRC_IPS_V1"

      config {
        src_ip_ranges = ["*"]
      }
    }

    rate_limit_options {
      conform_action = "allow"
      exceed_action  = "deny(429)"

      enforce_on_key = "IP"

      rate_limit_threshold {
        count        = ${c.rate}
        interval_sec = 60
      }
    }
  }

  rule {
    action      = "deny(403)"
    priority    = 900
    description = "Protecao contra SQL injection (preview primeiro!)"
    preview     = true

    match {
      expr {
        expression = "evaluatePreconfiguredExpr('sqli-v33-stable')"
      }
    }
  }
}`
  });

  C({
    id: 'run', cat: 'cont', name: 'Cloud Run', em: '🚀',
    tf: 'google_cloud_run_v2_service', multi: false, cost: 5,
    desc: 'Onde o GCP realmente brilha: contêiner rodando com escala a zero, HTTPS e domínio inclusos. É o ECS Fargate + ALB + ACM em um recurso só.',
    console: ['Cloud Run → Create service → escolher imagem do Artifact Registry → Autoscaling min/max → Variables & Secrets → Deploy'],
    gotchas: [
      '<code>min_instance_count = 0</code> = escala a zero e você paga zero, mas paga cold start.',
      'Secrets entram como <code>value_source.secret_key_ref</code>, sem nenhuma role de execução extra.',
      '<code>ingress = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"</code> se você quiser Cloud Run atrás do LB global.',
      'Sem <code>google_cloud_run_v2_service_iam_member</code> com <code>allUsers</code>, a URL responde 403.',
      'A imagem precisa escutar na porta da variável <code>PORT</code>.'
    ],
    inputs: [
      { k: 'min', l: 'Instâncias mínimas', t: 'num', v: 0, min: 0, max: 10 },
      { k: 'max', l: 'Instâncias máximas', t: 'num', v: 10, min: 1, max: 100 },
      { k: 'pub', l: 'Público (allUsers)', t: 'bool', v: true }
    ],
    file: 'cloudrun.tf',
    hcl: (c, ctx) => `resource "google_cloud_run_v2_service" "app" {
  name     = "\${local.name}"
  location = var.region
  ingress  = "INGRESS_TRAFFIC_ALL"

  template {
${ctx.has('sa') ? `    service_account = google_service_account.${ctx.nameOf('sa')}.email\n` : ''}
    scaling {
      min_instance_count = ${c.min}
      max_instance_count = ${c.max}
    }

    containers {
      image = "\${var.region}-docker.pkg.dev/\${var.project_id}/${ctx.has('ar') ? '\\${google_artifact_registry_repository.' + ctx.nameOf('ar') + '.repository_id}' : 'app'}/api:\${var.image_tag}"

      resources {
        limits = {
          cpu    = "1"
          memory = "512Mi"
        }
      }

      ports {
        container_port = 8080
      }
${ctx.has('secret') ? `
      env {
        name = "DB_PASSWORD"

        value_source {
          secret_key_ref {
            secret  = google_secret_manager_secret.app.secret_id
            version = "latest"
          }
        }
      }
` : ''}
      startup_probe {
        initial_delay_seconds = 5
        period_seconds        = 10
        failure_threshold     = 3

        http_get {
          path = "/health"
        }
      }
    }
  }

  traffic {
    type    = "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST"
    percent = 100
  }

  labels = local.labels
}

variable "image_tag" {
  type        = string
  description = "Tag da imagem — passe o SHA do commit"
  default     = "latest"
}
${c.pub ? `
# Sem isto a URL responde 403.
resource "google_cloud_run_v2_service_iam_member" "public" {
  location = google_cloud_run_v2_service.app.location
  name     = google_cloud_run_v2_service.app.name
  role     = "roles/run.invoker"
  member   = "allUsers"
}
` : ''}`,
    outputs: () => `output "cloud_run_url" {
  description = "URL publica ja com HTTPS"
  value       = google_cloud_run_v2_service.app.uri
}`
  });

  C({
    id: 'gke', cat: 'cont', name: 'GKE Autopilot', em: '☸️',
    tf: 'google_container_cluster', multi: false, cost: 75,
    desc: 'Kubernetes gerenciado de verdade: no modo Autopilot você não cria node pool, não escolhe máquina e paga por pod.',
    console: ['Kubernetes Engine → Create cluster → Autopilot → região → rede/subnet → ranges secundários → Create'],
    gotchas: [
      'Autopilot exige os <b>ranges secundários</b> da subnet (pods e services). Crie a VPC pensando nisso.',
      '<code>deletion_protection = true</code> é o padrão no provider 6.x — <code>terraform destroy</code> falha até você desligar.',
      'Workload Identity é o jeito certo de dar permissão GCP a um pod. Chave JSON de service account em Secret do K8s, nunca.',
      'Criar um cluster leva de 5 a 10 minutos. É normal o apply parecer travado.'
    ],
    inputs: [{ k: 'priv', l: 'Nodes privados', t: 'bool', v: true }],
    file: 'gke.tf',
    hcl: (c) => `resource "google_container_cluster" "main" {
  name     = "\${local.name}-gke"
  location = var.region

  # Autopilot: sem node pool, sem escolher maquina, paga por pod.
  enable_autopilot = true

  network    = google_compute_network.main.id
  subnetwork = google_compute_subnetwork.main.id

  ip_allocation_policy {
    cluster_secondary_range_name  = "pods"
    services_secondary_range_name = "services"
  }
${c.priv ? `
  private_cluster_config {
    enable_private_nodes    = true
    enable_private_endpoint = false
    master_ipv4_cidr_block  = "172.16.0.0/28"
  }
` : ''}
  release_channel {
    channel = "REGULAR"
  }

  # Padrao no provider 6.x — destroy falha ate voce desligar.
  deletion_protection = true

  depends_on = [google_project_service.apis]
}`
  });

  C({
    id: 'sql', cat: 'data', name: 'Cloud SQL (PostgreSQL)', em: '🗄️',
    tf: 'google_sql_database_instance', multi: false, cost: 35,
    desc: 'O RDS do GCP. A grande diferença: conectar em IP privado exige um <b>peering de rede</b> (Private Service Access) que você precisa criar antes.',
    console: [
      'SQL → Create instance → PostgreSQL → escolher tier',
      'Connections → Private IP → escolher a VPC → "Set up connection" (o console cria o peering por você)',
      'Backups → Automate + Point-in-time recovery'
    ],
    gotchas: [
      '<b>O peering é o pulo do gato:</b> <code>google_compute_global_address</code> (VPC_PEERING) + <code>google_service_networking_connection</code>. Sem eles, IP privado não funciona.',
      'Um <code>depends_on</code> na conexão de service networking evita o erro de corrida no primeiro apply.',
      '<code>ipv4_enabled = false</code> tira o IP público do banco.',
      'Nome de instância apagada fica <b>reservado por ~7 dias</b>: recriar com o mesmo nome falha.',
      'Cloud SQL Auth Proxy é a forma recomendada de conectar de fora sem abrir IP.'
    ],
    inputs: [
      { k: 'tier', l: 'Tier', t: 'sel', v: 'db-custom-1-3840', opts: [['db-f1-micro', 'db-f1-micro · ~US$ 9/mês'], ['db-custom-1-3840', 'db-custom-1-3840 · ~US$ 50/mês'], ['db-custom-2-7680', 'db-custom-2-7680 · ~US$ 100/mês']] },
      { k: 'ha', l: 'Alta disponibilidade', t: 'bool', v: false }
    ],
    file: 'sql.tf',
    hcl: (c) => `# --- Private Service Access: o "pulo do gato" do Cloud SQL privado ---
resource "google_compute_global_address" "psa" {
  name          = "\${local.name}-psa"
  purpose       = "VPC_PEERING"
  address_type  = "INTERNAL"
  prefix_length = 16
  network       = google_compute_network.main.id
}

resource "google_service_networking_connection" "psa" {
  network                 = google_compute_network.main.id
  service                 = "servicenetworking.googleapis.com"
  reserved_peering_ranges = [google_compute_global_address.psa.name]
}

resource "google_sql_database_instance" "main" {
  name             = "\${local.name}-pg"
  database_version = "POSTGRES_16"
  region           = var.region

  depends_on = [google_service_networking_connection.psa]

  settings {
    tier              = "${c.tier}"
    availability_type = "${c.ha ? 'REGIONAL' : 'ZONAL'}"
    disk_size         = 20
    disk_type         = "PD_SSD"
    disk_autoresize   = true

    ip_configuration {
      ipv4_enabled    = false
      private_network = google_compute_network.main.id
    }

    backup_configuration {
      enabled                        = true
      point_in_time_recovery_enabled = true
      start_time                     = "03:00"
    }

    database_flags {
      name  = "log_min_duration_statement"
      value = "1000"
    }

    insights_config {
      query_insights_enabled = true
    }
  }

  deletion_protection = true

  lifecycle {
    prevent_destroy = true
  }
}

resource "google_sql_database" "app" {
  name     = "app"
  instance = google_sql_database_instance.main.name
}`
  });

  C({
    id: 'gcs', cat: 'data', name: 'Bucket GCS', em: '🪣',
    tf: 'google_storage_bucket', multi: true, cost: 2,
    desc: 'Mais simples que o S3: versionamento, criptografia e ciclo de vida ficam <b>dentro</b> do mesmo recurso.',
    console: ['Cloud Storage → Create bucket → Access control: Uniform → Protection: prevenção de acesso público'],
    gotchas: [
      '<code>uniform_bucket_level_access = true</code> desliga ACLs por objeto. É o padrão moderno.',
      '<code>public_access_prevention = "enforced"</code> é o "Block all public access" da AWS.',
      'Nome também é global, como no S3.',
      'Escolha bem a <code>location</code>: <code>US</code> (multi-região) custa mais que <code>southamerica-east1</code> e muda a latência.'
    ],
    inputs: [{ k: 'name', l: 'Nome lógico', t: 'text', v: 'assets' }, { k: 'bucket', l: 'Nome do bucket', t: 'text', v: 'minha-app-assets-prod' }],
    file: 'storage.tf',
    hcl: (c) => `resource "google_storage_bucket" "${c._n}" {
  name                        = "${c.bucket}"
  location                    = "SOUTHAMERICA-EAST1"
  storage_class               = "STANDARD"
  uniform_bucket_level_access = true
  public_access_prevention    = "enforced"
  force_destroy               = false

  versioning {
    enabled = true
  }

  lifecycle_rule {
    condition {
      num_newer_versions = 3
    }

    action {
      type = "Delete"
    }
  }

  lifecycle_rule {
    condition {
      age = 30
    }

    action {
      type          = "SetStorageClass"
      storage_class = "NEARLINE"
    }
  }

  labels = local.labels
}`
  });

  C({
    id: 'dns', cat: 'ops', name: 'Cloud DNS', em: '🧾',
    tf: 'google_dns_record_set', multi: false, cost: 0.4,
    desc: 'Aponta o domínio para o IP global do balanceador. Sem "alias": o IP é estático e anycast, então um registro A simples resolve.',
    console: ['Network services → Cloud DNS → Create zone → Add record set → tipo A → IPv4 do LB'],
    gotchas: [
      'O nome do registro precisa terminar com <b>ponto</b>: <code>app.exemplo.com.br.</code>',
      'O certificado gerenciado só valida <b>depois</b> que este registro existe e propaga.',
      'Não existe alias — mas como o IP global é fixo, um A record basta.'
    ],
    inputs: [{ k: 'zone', l: 'Domínio da zona', t: 'text', v: 'exemplo.com.br' }, { k: 'name', l: 'Registro', t: 'text', v: 'app.exemplo.com.br' }],
    file: 'dns.tf',
    hcl: (c) => `resource "google_dns_managed_zone" "main" {
  name     = "\${local.name}-zone"
  dns_name = "${c.zone}."

  dnssec_config {
    state = "on"
  }
}

resource "google_dns_record_set" "app" {
  name         = "${c.name}."
  type         = "A"
  ttl          = 300
  managed_zone = google_dns_managed_zone.main.name
  rrdatas      = [google_compute_global_address.main.address]
}`
  });

  C({
    id: 'alert', cat: 'ops', name: 'Alerta + canal de notificação', em: '🚨',
    tf: 'google_monitoring_alert_policy', multi: false, cost: 0,
    desc: 'Alerta do Cloud Monitoring com filtro MQL/PromQL. Mais verboso que o CloudWatch, porém mais expressivo.',
    console: ['Monitoring → Alerting → Create policy → Select a metric → Configure trigger → Notification channels'],
    gotchas: [
      'O <code>filter</code> é a parte difícil: <code>metric.type</code> + <code>resource.type</code> precisam existir de verdade.',
      'Canal de e-mail não exige confirmação (diferente do SNS da AWS).',
      '<code>alignment_period</code> menor que 60s costuma não ser suportado.'
    ],
    inputs: [{ k: 'email', l: 'E-mail', t: 'text', v: 'sre@exemplo.com.br' }],
    file: 'monitoring.tf',
    hcl: (c) => `resource "google_monitoring_notification_channel" "email" {
  display_name = "SRE \${local.name}"
  type         = "email"

  labels = {
    email_address = "${c.email}"
  }
}

resource "google_monitoring_alert_policy" "backend_5xx" {
  display_name = "\${local.name} — taxa de 5xx alta"
  combiner     = "OR"

  conditions {
    display_name = "5xx no balanceador"

    condition_threshold {
      filter          = "metric.type=\\"loadbalancing.googleapis.com/https/request_count\\" AND resource.type=\\"https_lb_rule\\""
      duration        = "300s"
      comparison      = "COMPARISON_GT"
      threshold_value = 10

      aggregations {
        alignment_period   = "60s"
        per_series_aligner = "ALIGN_RATE"
      }
    }
  }

  notification_channels = [google_monitoring_notification_channel.email.id]

  alert_strategy {
    auto_close = "1800s"
  }
}`
  });
})(window.IAC);

(function (IAC) {
