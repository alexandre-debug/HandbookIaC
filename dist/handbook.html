      {
        id: 'lb-gcp', title: 'O Load Balancer do GCP em 5 peças',
        body: () => `
<span class="eyebrow gcp">GCP · 03</span>
<h1>O balanceador em cinco peças</h1>
<p class="lede">Esta é a parte que mais assusta quem vem da AWS. Depois que você entende que cada peça tem uma responsabilidade única, fica lógico.</p>

<h2>A cadeia, de fora para dentro</h2>
${code(`Internet
   │
   ▼
google_compute_global_address          IP anycast global
   │
google_compute_global_forwarding_rule  "escute na porta 443 deste IP"
   │
google_compute_target_https_proxy      termina o TLS
   │   └── google_compute_managed_ssl_certificate
   │
google_compute_url_map                 "/api/* vai para cá, resto para lá"
   │
google_compute_backend_service         o "target group": grupos + política
   │   └── google_compute_health_check
   │   └── google_compute_security_policy (Cloud Armor)
   │
google_compute_region_instance_group_manager   as VMs (via named_port)`, { lang: 'text' })}

<h2>O código completo</h2>
${code(`# 1. IP global — reserve, senão ele muda a cada recriação
resource "google_compute_global_address" "main" {
  name = "\${local.name}-ip"
}

# 2. Certificado gerenciado (grátis, renovação automática)
resource "google_compute_managed_ssl_certificate" "main" {
  name = "\${local.name}-cert"

  managed {
    domains = ["app.exemplo.com.br"]
  }

  lifecycle {
    create_before_destroy = true
  }
}

# 3. Health check — recurso independente, reaproveitável
resource "google_compute_health_check" "app" {
  name                = "\${local.name}-hc"
  check_interval_sec  = 10
  timeout_sec         = 5
  healthy_threshold   = 2
  unhealthy_threshold = 3

  http_health_check {
    port         = 8080
    request_path = "/health"
  }
}

# 4. Backend service — o "target group"
resource "google_compute_backend_service" "app" {
  name                  = "\${local.name}-backend"
  protocol              = "HTTP"
  port_name             = "http"          # bate com o named_port do MIG
  load_balancing_scheme = "EXTERNAL_MANAGED"
  timeout_sec           = 30

  health_checks = [google_compute_health_check.app.id]

  backend {
    group           = google_compute_region_instance_group_manager.app.instance_group
    balancing_mode  = "UTILIZATION"
    capacity_scaler = 1.0
  }

  log_config {
    enable      = true
    sample_rate = 1.0
  }
}

# 5. URL map — o roteamento
resource "google_compute_url_map" "main" {
  name            = "\${local.name}-urlmap"
  default_service = google_compute_backend_service.app.id
}

# 6. Proxy — termina o TLS
resource "google_compute_target_https_proxy" "main" {
  name             = "\${local.name}-https-proxy"
  url_map          = google_compute_url_map.main.id
  ssl_certificates = [google_compute_managed_ssl_certificate.main.id]
}

# 7. Forwarding rule — o que realmente escuta
resource "google_compute_global_forwarding_rule" "https" {
  name                  = "\${local.name}-https"
  target                = google_compute_target_https_proxy.main.id
  port_range            = "443"
  ip_address            = google_compute_global_address.main.address
  load_balancing_scheme = "EXTERNAL_MANAGED"
}`, { file: 'lb.tf' })}

${danger('load_balancing_scheme precisa combinar', 'O mesmo valor tem que aparecer no <b>backend service</b> e na <b>forwarding rule</b>. Misturar <code>EXTERNAL</code> (clássico) com <code>EXTERNAL_MANAGED</code> (Envoy, o atual) produz erro obscuro do tipo <code>Invalid value for field</code>. Use <code>EXTERNAL_MANAGED</code> em projetos novos.')}

<h2>O redirect 80 → 443 é a cadeia inteira de novo</h2>
${code(`resource "google_compute_url_map" "redirect" {
  name = "\${local.name}-redirect"

  default_url_redirect {
    https_redirect         = true
    redirect_response_code = "MOVED_PERMANENTLY_DEFAULT"
    strip_query            = false
  }
}

resource "google_compute_target_http_proxy" "redirect" {
  name    = "\${local.name}-http-proxy"
  url_map = google_compute_url_map.redirect.id
}

resource "google_compute_global_forwarding_rule" "http" {
  name                  = "\${local.name}-http"
  target                = google_compute_target_http_proxy.redirect.id
  port_range            = "80"
  ip_address            = google_compute_global_address.main.address
  load_balancing_scheme = "EXTERNAL_MANAGED"
}`, { file: 'redirect.tf' })}
${warn('Na AWS isso é uma flag', 'O <code>default_action { type = "redirect" }</code> do listener resolve em 8 linhas. No GCP são 3 recursos. É o preço da composição.')}

<h2>O vínculo MIG ↔ backend service</h2>
${code(`resource "google_compute_region_instance_group_manager" "app" {
  # ...

  # Dá NOME à porta. O backend service procura por este nome.
  named_port {
    name = "http"
    port = 8080
  }
}

resource "google_compute_backend_service" "app" {
  port_name = "http"   # <<< o vínculo acontece aqui

  backend {
    group = google_compute_region_instance_group_manager.app.instance_group
  }
}`, { file: 'o "vincular ao TG" do GCP' })}
${info('A diferença conceitual', 'Na AWS o ASG <b>empurra</b> as instâncias para o Target Group (<code>target_group_arns</code>). No GCP o backend service <b>aponta</b> para o grupo de instâncias e resolve a porta pelo nome. O resultado é o mesmo; o sentido da referência é invertido.')}

<h2>Três erros que custam uma tarde</h2>
${table(['Sintoma', 'Causa', 'Correção'],
          [['Todos os backends UNHEALTHY', 'firewall bloqueando os health checkers', 'liberar <code>35.191.0.0/16</code> e <code>130.211.0.0/22</code>'],
          ['Certificado eternamente PROVISIONING', 'DNS ainda não aponta para o IP', 'crie o registro A primeiro; espere até 60 min'],
          ['502 no LB, VM saudável', '<code>port_name</code> não bate com o <code>named_port</code>', 'confira os dois nomes']])}
`},

      {
        id: 'run', title: 'Cloud Run e Artifact Registry',
        body: () => `
<span class="eyebrow gcp">GCP · 04</span>
<h1>Cloud Run: onde o GCP ganha</h1>
<p class="lede">Se a sua aplicação está em contêiner e é stateless, este capítulo pode substituir o ALB, o Target Group, o ASG, o certificado e o autoscaling — por um recurso.</p>

<h2>A comparação honesta</h2>
${table(['Necessidade', 'AWS (ECS Fargate + ALB)', 'GCP (Cloud Run)'],
          [['Rodar o contêiner', '<code>aws_ecs_task_definition</code> + <code>aws_ecs_service</code>', '<code>google_cloud_run_v2_service</code>'],
          ['Receber tráfego HTTPS', 'ALB + listener + target group + ACM', 'incluso'],
          ['Domínio', 'Route 53 + alias', 'URL <code>*.run.app</code> incluso'],
          ['Escala', '<code>aws_appautoscaling_*</code>', '<code>scaling { min, max }</code>'],
          ['Escala a zero', 'não (Fargate cobra a task ligada)', '<b>sim</b>, custo zero parado'],
          ['Recursos Terraform', '~10', '<b>2</b>'],
          ['Custo parado', '~US$ 40/mês (ALB + 1 task)', '<b>US$ 0</b>']])}

<h2>Artifact Registry + Cloud Run</h2>
${code(`resource "google_artifact_registry_repository" "app" {
  location      = var.region
  repository_id = "app"
  format        = "DOCKER"

  docker_config {
    immutable_tags = true
  }

  cleanup_policies {
    id     = "manter-recentes"
    action = "KEEP"

    most_recent_versions {
      keep_count = 10
    }
  }
}

resource "google_cloud_run_v2_service" "app" {
  name     = local.name
  location = var.region
  ingress  = "INGRESS_TRAFFIC_ALL"

  template {
    service_account = google_service_account.app.email

    scaling {
      min_instance_count = 0    # escala a zero
      max_instance_count = 100
    }

    containers {
      image = "\${var.region}-docker.pkg.dev/\${var.project_id}/app/api:\${var.image_tag}"

      resources {
        limits = {
          cpu    = "1"
          memory = "512Mi"
        }
      }

      ports {
        container_port = 8080
      }

      # Secret direto, sem role de execução separada
      env {
        name = "DB_PASSWORD"

        value_source {
          secret_key_ref {
            secret  = google_secret_manager_secret.app.secret_id
            version = "latest"
          }
        }
      }

      startup_probe {
        initial_delay_seconds = 5
        period_seconds        = 10
        failure_threshold     = 3

        http_get {
          path = "/health"
        }
      }
    }
  }

  traffic {
    type    = "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST"
    percent = 100
  }
}

# Sem isto, a URL responde 403
resource "google_cloud_run_v2_service_iam_member" "public" {
  location = google_cloud_run_v2_service.app.location
  name     = google_cloud_run_v2_service.app.name
  role     = "roles/run.invoker"
  member   = "allUsers"
}`, { file: 'cloudrun.tf' })}

<h2>Deploy canário sem nenhuma infra extra</h2>
${code(`resource "google_cloud_run_v2_service" "app" {
  # ...

  traffic {
    type     = "TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION"
    revision = "app-v2"
    percent  = 10        # 10% na versão nova
  }

  traffic {
    type     = "TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION"
    revision = "app-v1"
    percent  = 90
  }
}`, { file: 'canário' })}
${tip('Na AWS isso exigiria', 'Dois target groups, uma regra de listener com <code>forward</code> ponderado, e um processo para trocar os pesos. No Cloud Run é uma alteração de percentual.')}

<h2>Quando NÃO usar Cloud Run</h2>
<ul>
<li><b>Processo de longa duração</b> (worker, fila): existe Cloud Run Jobs, mas o modelo de request/response não se aplica.</li>
<li><b>WebSocket de longa duração</b>: suportado, mas com limite de 60 minutos por conexão.</li>
<li><b>Cold start é inaceitável</b>: use <code>min_instance_count = 1</code> e você já perdeu o custo zero.</li>
<li><b>Precisa de disco persistente</b>: não tem (dá para montar GCS via FUSE, com ressalvas).</li>
<li><b>Aplicação stateful</b>: não é o lugar.</li>
</ul>

<h2>Cloud Run atrás do LB global</h2>
${code(`# Para ter domínio próprio, Cloud Armor e CDN na frente:
resource "google_compute_region_network_endpoint_group" "run" {
  name                  = "\${local.name}-neg"
  region                = var.region
  network_endpoint_type = "SERVERLESS"

  cloud_run {
    service = google_cloud_run_v2_service.app.name
  }
}

resource "google_compute_backend_service" "run" {
  name                  = "\${local.name}-backend"
  load_balancing_scheme = "EXTERNAL_MANAGED"

  backend {
    group = google_compute_region_network_endpoint_group.run.id
  }
}`, { file: 'run + lb.tf' })}
${info('Serverless NEG', 'É o adaptador entre o mundo serverless e o balanceador. O mesmo mecanismo serve para Cloud Functions e App Engine.')}
`},

      {
        id: 'migrar', title: 'O mesmo stack, nas duas nuvens',
        body: () => `
<span class="eyebrow gcp">GCP · 05</span>
<h1>O mesmo stack, lado a lado</h1>
<p class="lede">Aquele fluxo do console — registry, secret, target group, autoscaling, load balancer, policy — escrito nas duas nuvens, na mesma ordem.</p>

<h2>1. Registro de imagem</h2>
<div class="split">
${code(`resource "aws_ecr_repository" "api" {
  name                 = "app/api"
  image_tag_mutability = "IMMUTABLE"

  image_scanning_configuration {
    scan_on_push = true
  }
}

resource "aws_ecr_lifecycle_policy" "api" {
  repository = aws_ecr_repository.api.name

  policy = jsonencode({
    rules = [{
      rulePriority = 1
      selection = {
        tagStatus   = "any"
        countType   = "imageCountMoreThan"
        countNumber = 10
      }
      action = { type = "expire" }

${code(`resource "google_artifact_registry_repository" "api" {

<div class="split">
${code(`resource "aws_secretsmanager_secret" "app" {
  name = "prod/app/env"
}

resource "aws_secretsmanager_secret_version" "app" {

resource "google_secret_manager_secret_version" "app" {

resource "aws_iam_role" "app" {

data "aws_iam_policy_document" "app" {

${code(`resource "google_service_account" "app" {

${info('A diferença de filosofia', 'A AWS descreve permissões com um documento de política que você anexa. O GCP concede um papel pronto a um membro, preferencialmente no próprio recurso. O código GCP fica menor; em compensação você depende dos papéis predefinidos serem granulares o suficiente.')}

<h2>4. Health check + grupo de destinos</h2>

${code(`resource "aws_lb_target_group" "api" {

<h2>5. Autoscaling e o vínculo</h2>

        body: () => `
<span class="eyebrow">Referência</span>
<h1>Comandos</h1>
<p class="lede">Tudo que você vai digitar de verdade, agrupado por situação.</p>

<h2>O dia a dia</h2>
${code(`terraform init                     # baixa providers, configura backend
terraform init -upgrade            # atualiza dentro da restrição de versão
terraform init -reconfigure        # troca de backend
terraform fmt -recursive           # formata tudo
terraform validate                 # sintaxe e referências
terraform plan                     # o diff
terraform plan -out=tfplan         # salva o plano (o jeito certo no CI)
terraform apply tfplan             # aplica EXATAMENTE o plano revisado
terraform apply -auto-approve      # só em CI
terraform destroy`, { lang: 'bash' })}

<h2>Investigando</h2>
${code(`terraform state list                          # tudo que o Terraform conhece
terraform state list | grep aws_lb            # filtrando
terraform state show aws_lb.public            # detalhes de um recurso
terraform show                                # state inteiro, legível
terraform show -json | jq '.values.root_module.resources[].address'
terraform output                              # todos os outputs
terraform output -raw alb_dns_name            # sem aspas, para script
terraform graph | dot -Tsvg > grafo.svg       # o grafo de dependências
terraform providers                           # árvore de providers
terraform version`, { lang: 'bash' })}

<h2>Consertando</h2>
${code(`terraform apply -replace=aws_instance.web    # recria só este recurso
terraform apply -target=module.rede           # aplica só uma parte (emergência)
terraform apply -refresh-only                 # aceita o que mudou por fora
terraform plan -refresh-only                  # detecta drift sem aplicar
terraform force-unlock LOCK_ID                # lock preso (com MUITO cuidado)
terraform state rm aws_instance.antiga        # esquece (não apaga na nuvem)

<span class="eyebrow">Referência</span>
<h1>Erros comuns</h1>
<p class="lede">Os erros que todo mundo toma, com a causa real e a saída. Use o buscador (tecla <kbd>/</kbd>) para achar a sua mensagem.</p>

<h2>Error acquiring the state lock</h2>
<p><b>Causa:</b> outro apply está rodando — ou um CI morreu no meio e deixou o lock preso.</p>
${code(`# 1. Confirme que ninguém está aplicando (pergunte no canal do time!)
# 2. Só então:
terraform force-unlock 7e3f1a2b-...`, { lang: 'bash' })}
${danger('force-unlock com apply rodando corrompe o state', 'Se houver mesmo um apply em andamento, você vai acabar com dois processos escrevendo o mesmo arquivo. Confirme antes.')}

<h2>Resource already exists / AlreadyExistsException</h2>
<p><b>Causa:</b> o recurso existe na nuvem mas não está no state. Quase sempre porque alguém criou no console, ou um apply anterior falhou no meio.</p>
${code(`terraform import aws_ecr_repository.api minha-app/api
terraform plan   # ajuste o código até o plan ficar vazio`, { lang: 'bash' })}

<p><b>Mensagem:</b> <i>the "for_each" value depends on resource attributes that cannot be determined until apply</i>.</p>
<p><b>Causa:</b> a chave do <code>for_each</code> depende de algo que só existe depois do apply (um <code>.id</code>, um <code>.arn</code>).</p>
${code(`# ❌ chave desconhecida no plan

}

# ✅ chave estática/variável
resource "aws_route53_record" "r" {
  for_each = { for i, az in local.azs : az => i }
}`)}
${tip('Saída de emergência', 'Aplique em duas etapas: <code>terraform apply -target=aws_subnet.private</code> e depois o apply completo. Mas conserte a chave — <code>-target</code> não é solução permanente.')}

<h2>Cycle: a → b → a</h2>
<p><b>Causa:</b> dois recursos se referenciam mutuamente. Muito comum entre security groups.</p>
${code(`# ❌ ciclo: cada SG referencia o outro no bloco inline

}
resource "aws_security_group" "b" {
  ingress { security_groups = [aws_security_group.a.id] }
}

# ✅ crie os SGs vazios e as regras como recursos separados

resource "aws_security_group" "b" { name = "b" }

<h2>target group is currently in use by a listener</h2>
<p><b>Causa:</b> o Terraform tenta destruir o TG antes de criar o novo. Falta <code>create_before_destroy</code>.</p>

<p><b>Causa:</b> o secret foi destruído mas o nome fica reservado pelo <code>recovery_window_in_days</code>.</p>

<p><b>Causa:</b> bug do provider, ou um valor que a nuvem normaliza (uma policy JSON reordenada, um ARN em maiúscula).</p>

/* ===== assets/js/lab.js ===== */
/* =========================================================
   lab.js — o laboratório: montar, gerar, planejar, aplicar
   ========================================================= */
(function (IAC) {
  'use strict';
  const $ = IAC.$, $$ = IAC.$$, esc = IAC.esc, H = IAC.hcl;

  const S = {
    aws: null, gcp: null, cloud: 'aws'
  };
  function blank(cloud) {
    return { cloud: cloud, items: [], sel: null, tab: 'build', applied: {}, drift: {}, serial: 0, initialized: false, planTxt: '', applyTxt: '' };
  }
  function st() { return S[S.cloud]; }
  function load() {
    ['aws', 'gcp'].forEach(c => {
      const raw = IAC.store.get('lab.' + c, null);
      S[c] = raw && raw.items ? raw : blank(c);
      S[c].cloud = c;
    });
  }
  function save() { IAC.store.set('lab.' + S.cloud, st()); }
  function catalog() { return S.cloud === 'aws' ? IAC.awsRes : IAC.gcpRes; }
  function cats() { return S.cloud === 'aws' ? IAC.awsCats : IAC.gcpCats; }
  function def(cid) { return catalog().filter(d => d.id === cid)[0]; }

  /* ---------------- assembler ---------------- */
  function tfName(s) {
    let n = String(s || 'main').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9_]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    if (!n || /^[0-9]/.test(n)) n = 'r_' + n;
    return n;
  }
  function cfgOf(item) {
    const d = def(item.cid); if (!d) return null;
    const c = {};
    (d.inputs || []).forEach(i => { c[i.k] = (item.cfg && item.cfg[i.k] !== undefined) ? item.cfg[i.k] : i.v; });
    c._n = tfName(c.name !== undefined ? c.name : d.id);
    c._cid = d.id;
    return c;
  }

  function assemble() {
    const s = st();
    const order = catalog().map(d => d.id);
    const items = s.items.slice().sort((a, b) => order.indexOf(a.cid) - order.indexOf(b.cid));
    const prep = items.map(it => ({ it: it, d: def(it.cid), c: cfgOf(it) })).filter(x => x.d && x.c);
    const byCid = {}; prep.forEach(p => { if (!byCid[p.d.id]) byCid[p.d.id] = []; byCid[p.d.id].push(p); });

    const flags = { vpcData: false, missingSG: [] };
    const ctx = {

        (e.explicit ? ' stroke-dasharray="4 3"' : '') + ' marker-end="url(#ah)"/>';

        '<rect x="' + p.x + '" y="' + p.y + '" width="3.5" height="' + NH + '" rx="2" fill="' + col + '"/>' +
        '<text x="' + (p.x + 12) + '" y="' + (p.y + 17) + '" font-size="11" font-family="var(--mono)" fill="var(--tx)">' + dataMark + esc(short.slice(0, 26)) + '</text>' +
        '<text x="' + (p.x + 12) + '" y="' + (p.y + 31) + '" font-size="10" font-family="var(--mono)" fill="var(--tx-3)">' + esc(n.name) + '</text>' +
        '<title>' + esc(n.addr) + '</title></g>';

    svg += '</svg>';

    if (!found.length && !miss.length) {
      html += '<div class="lint ok"><span class="sev">ok</span><div><div class="msg">Nenhum problema encontrado. Esse projeto passaria em uma revisão de PR.</div></div></div>';

      html += IAC.table(['Componente', 'US$/mês aprox.'], cost.lines.map(l => [esc(l.n), '<b>' + l.v.toFixed(0) + '</b>']).concat([['<b>Total</b>', '<b>' + cost.total.toFixed(0) + '</b>']]));
    } else html += '<p style="color:var(--tx-3)">Nada com custo relevante ainda.</p>';

    const g = H.graph(A.blocks);
    html += '<h4>Resumo</h4>';
    html += '<div class="kv"><b>Recursos gerenciados</b><span>' + g.nodes.filter(n => n.kind === 'resource').length + '</span></div>';
    html += '<div class="kv"><b>Data sources</b><span>' + g.nodes.filter(n => n.kind === 'data').length + '</span></div>';
    html += '<div class="kv"><b>Arestas de dependência</b><span>' + g.edges.length + '</span></div>';
    html += '<div class="kv"><b>Arquivos gerados</b><span>' + A.files.map(f => f.name).join(', ') + '</span></div>';

  /* ---------- drift (ClickOps) ---------- */
  const DRIFTS = [

      '<span class="o-b">Ciclo de vida</span>\n' +
      '  <span class="o-cy">terraform init</span>       baixa providers e configura o backend\n' +
      '  <span class="o-cy">terraform validate</span>   checa sintaxe e referências (sem falar com a nuvem)\n' +
      '  <span class="o-cy">terraform fmt</span>        formata os arquivos\n' +
      '  <span class="o-cy">terraform plan</span>       mostra o que mudaria — <b>sempre leia antes de aplicar</b>\n' +
      '  <span class="o-cy">terraform apply</span>      aplica (pede confirmação; -auto-approve pula)\n' +
      '  <span class="o-cy">terraform destroy</span>    remove tudo que está no state\n\n' +
      '<span class="o-b">Investigação</span>\n' +
      '  <span class="o-cy">terraform state list</span>          lista o que o Terraform conhece\n' +
      '  <span class="o-cy">terraform state show &lt;addr&gt;</span>   detalha um recurso\n' +
      '  <span class="o-cy">terraform show</span>                despeja o state inteiro\n' +
      '  <span class="o-cy">terraform output</span>              valores exportados\n' +
      '  <span class="o-cy">terraform graph</span>               grafo de dependências\n\n' +
      '<span class="o-b">Manutenção</span>\n' +
      '  <span class="o-cy">terraform import &lt;addr&gt; &lt;id&gt;</span>  adota um recurso criado no console\n' +
      '  <span class="o-cy">terraform apply -replace=&lt;addr&gt;</span> recria um recurso específico\n' +
      '  <span class="o-cy">terraform apply -refresh-only</span>   só reconcilia o state com a realidade\n' +
      '  <span class="o-cy">terraform workspace list|new|select</span>\n\n' +
      '<span class="o-dim">shell: ls · cat &lt;arquivo&gt; · clear</span>');
  }

  function tfInit(args) {
    const st = s();
    write('<span class="o-b">Initializing the backend...</span>');
    const A2 = A();
    const hasBackend = A2.blocks.some(b => b.kind === 'terraform' && /backend\s+"/.test(b.raw));
    if (hasBackend) write('\nSuccessfully configured the backend "' + (IAC.lab.S.cloud === 'aws' ? 's3' : 'gcs') + '"! Terraform will automatically\nuse this backend unless the backend configuration changes.');
    else write('<span class="o-chg">\nAviso: nenhum backend configurado — o state fica em ./terraform.tfstate,\nsem lock e sem histórico. Adicione o componente "Backend remoto".</span>');
    write('\n<span class="o-b">Initializing provider plugins...</span>');
    const pv = IAC.lab.S.cloud === 'aws' ? ['hashicorp/aws', 'v5.68.0', '"~> 5.60"'] : ['hashicorp/google', 'v6.8.0', '"~> 6.8"'];
    write('- Finding ' + pv[0] + ' versions matching ' + pv[2] + '...\n- Installing ' + pv[0] + ' ' + pv[1] + '...\n- Installed ' + pv[0] + ' ' + pv[1] + ' <span class="o-dim">(signed by HashiCorp)</span>');
    write('\nTerraform has created a lock file <span class="o-cy">.terraform.lock.hcl</span>. Faça commit dele:\né o que garante que todo mundo use exatamente a mesma versão do provider.');
    write('\n<span class="o-add">Terraform has been successfully initialized!</span>');
    st.initialized = true; IAC.lab.save();
  }

  function tfValidate() {
    if (!s().initialized) return write('<span class="o-del">╷\n│ Error: Missing required provider\n│ Rode "terraform init" primeiro.\n╵</span>');
    const A2 = A();
    const miss = IAC.lab.missingRefs(A2.blocks);
    if (!miss.length) return write('<span class="o-add">Success!</span> The configuration is valid.');
    miss.forEach(m => {
      write('<span class="o-del">╷\n│ Error: Reference to undeclared resource\n│\n│   A managed resource "' +
        esc(m.split('.')[0]) + '" "' + esc(m.split('.')[1]) + '" has not been declared.\n╵</span>');
    });
  }

  function tfPlan() {
    const st = s();
    if (!st.initialized) return write('<span class="o-del">╷\n│ Error: Backend initialization required\n│ Rode "terraform init" primeiro.\n╵</span>');
    const A2 = A();
    const p = H.plan(A2.blocks, st.applied, st.drift);
    write(p.html);
    if (p.add + p.change + p.destroy > 0) {
      write('<span class="o-dim">\nNote: You didn\'t use the -out option to save this plan, so Terraform can\'t\nguarantee to take exactly these actions if you run "terraform apply" now.</span>');
    }
  }

  function tfApply(args) {
    const st = s();
    if (!st.initialized) return write('<span class="o-del">Error: rode "terraform init" primeiro.</span>');
    if (args.indexOf('-refresh-only') >= 0) {
      if (!Object.keys(st.drift).length) return write('<span class="o-b">No changes.</span> Your infrastructure still matches the configuration.');
      write('<span class="o-chg">Note: Objects have changed outside of Terraform</span>\n\nO refresh-only <b>aceita</b> a realidade e atualiza o state, sem mexer na nuvem.\nUse quando a mudança manual era legítima e você vai trazê-la para o código depois.');
      return;
    }
    const A2 = A();
    const p = H.plan(A2.blocks, st.applied, st.drift);
    if (!p.add && !p.change && !p.destroy) return write('<span class="o-b">No changes.</span> Your infrastructure matches the configuration.\n\n<span class="o-b">Apply complete!</span> Resources: 0 added, 0 changed, 0 destroyed.');
    write(p.html);
    if (args.indexOf('-auto-approve') >= 0) return doApply(p, false);
    write('\n<span class="o-b">Do you want to perform these actions?</span>\n  Terraform will perform the actions described above.\n  Only \'yes\' will be accepted to approve.\n\n  <span class="o-b">Enter a value:</span> <span class="cursor-blink"></span>');
    pending = function (ans) {
      if (ans.trim() !== 'yes') return write('\n<span class="o-chg">Apply cancelled.</span>');
      doApply(p, false);
    };
  }

  function doApply(p, destroy) {
    const st = s();
    write('');
    p.actions.forEach(a => {
      if (a.act === 'create') {
        const b = p.graph.byAddr[a.addr];
        const id = H.fakeId(b), dur = H.fakeDur(b.type || '');
        write('<span class="o-hl">' + esc(a.addr) + '</span>: Creating...');
        if (dur > 30) write('<span class="o-hl">' + esc(a.addr) + '</span>: Still creating... <span class="o-dim">[' + H.fmtDur(Math.round(dur / 2)) + ' elapsed]</span>');
        write('<span class="o-hl">' + esc(a.addr) + '</span>: <span class="o-add">Creation complete after ' + H.fmtDur(dur) + '</span> <span class="o-dim">[id=' + esc(String(id).slice(0, 52)) + ']</span>');
        st.applied[a.addr] = { id: id };
      } else if (a.act === 'update') {
        write('<span class="o-hl">' + esc(a.addr) + '</span>: Modifying... <span class="o-dim">[id=' + esc(st.applied[a.addr].id).slice(0, 40) + ']</span>');
        write('<span class="o-hl">' + esc(a.addr) + '</span>: <span class="o-chg">Modifications complete after 3s</span>');
        delete st.drift[a.addr];
      } else {
        write('<span class="o-hl">' + esc(a.addr) + '</span>: <span class="o-del">Destroying...</span>');
        write('<span class="o-hl">' + esc(a.addr) + '</span>: <span class="o-del">Destruction complete after 2s</span>');
        delete st.applied[a.addr];
      }
    });
    st.serial++;
    IAC.lab.save();
    write('\n<span class="o-b">Apply complete!</span> Resources: <span class="o-add">' + p.add + ' added</span>, <span class="o-chg">' + p.change + ' changed</span>, <span class="o-del">' + p.destroy + ' destroyed</span>.');
  }

  function tfDestroy(args) {
    const st = s();
    const n = Object.keys(st.applied).length;
    if (!n) return write('<span class="o-b">No changes.</span> No objects need to be destroyed.');
    write('<span class="o-b">Plan:</span> 0 to add, 0 to change, <span class="o-del">' + n + ' to destroy</span>.');
    const go = () => {
      const A2 = A();
      const p = H.plan(A2.blocks, st.applied, st.drift);
      const ord = p.order.slice().reverse().filter(a => st.applied[a]);
      Object.keys(st.applied).forEach(a => { if (ord.indexOf(a) < 0) ord.push(a); });
      ord.forEach(a => {
        write('<span class="o-hl">' + esc(a) + '</span>: <span class="o-del">Destroying...</span> <span class="o-dim">[id=' + esc(st.applied[a].id).slice(0, 40) + ']</span>');
        write('<span class="o-hl">' + esc(a) + '</span>: <span class="o-del">Destruction complete after ' + (1 + a.length % 4) + 's</span>');
      });
      st.applied = {}; st.drift = {}; st.serial++; IAC.lab.save();
      write('\n<span class="o-b">Destroy complete!</span> Resources: <span class="o-del">' + ord.length + ' destroyed</span>.');
    };
    if (args.indexOf('-auto-approve') >= 0) return go();
    write('\n<span class="o-del">Do you really want to destroy all resources?</span>\n  Only \'yes\' will be accepted.\n\n  <span class="o-b">Enter a value:</span> <span class="cursor-blink"></span>');
    pending = function (ans) { if (ans.trim() !== 'yes') return write('\n<span class="o-chg">Destroy cancelled.</span>'); go(); };
  }

  function tfState(args) {
    const st = s(), addrs = Object.keys(st.applied).sort();
    if (args[0] === 'list') {
      if (!addrs.length) return write('<span class="o-dim">(state vazio — rode um apply)</span>');
      return write(addrs.map(a => esc(a)).join('\n'));
    }
    if (args[0] === 'show') {
      const a = args[1];
      if (!a || !st.applied[a]) return write('<span class="o-del">No instance found for ' + esc(a || '') + '</span>');
      const A2 = A(), b = H.graph(A2.blocks).byAddr[a];
      let o = '# ' + esc(a) + ':\nresource "' + esc(b.type) + '" "' + esc(b.name) + '" {\n';
      o += '    id = "' + esc(st.applied[a].id) + '"\n';
      b.items.filter(i => i.t === 'attr' && i.val.indexOf('\n') < 0).slice(0, 14).forEach(i => {
        o += '    ' + esc(IAC.pad(i.key, 22)) + ' = ' + esc(i.val) + '\n';
      });
      o += '}';
      return write('<span class="o-dim">' + o + '</span>');
    }
    if (args[0] === 'rm') return write('<span class="o-chg">"state rm" tira o recurso do state SEM apagar na nuvem.</span>\nUse quando quiser "esquecer" um recurso — ele vira órfão e ninguém mais gerencia.');
    if (args[0] === 'mv') return write('<span class="o-chg">"state mv" renomeia sem recriar.</span>\nHoje o jeito recomendado é o bloco <span class="o-cy">moved</span> no código — versionado e revisável no PR.');
    return write('Usage: terraform state &lt;list|show|rm|mv|pull|push&gt;');
  }

  function tfShow() {
    const st = s();
    if (!Object.keys(st.applied).length) return write('<span class="o-dim">The state file is empty. No resources are represented.</span>');
    const A2 = A();
    write('<span class="o-dim">' + esc(H.tfstate(A2.blocks, st.applied, st.serial).slice(0, 2400)) + '\n...</span>');
  }

  function tfOutput(args) {
    const st = s();
    if (!Object.keys(st.applied).length) return write('<span class="o-chg">Warning: No outputs found</span>\nRode um apply primeiro.');
    const A2 = A();
    const f = A2.files.filter(x => x.name === 'outputs.tf')[0];
    if (!f) return write('<span class="o-dim">Nenhum output declarado. Adicione ECR, VPC, ALB ou Cloud Run.</span>');
    const obs = H.parse(f.text).filter(b => b.kind === 'output');
    obs.forEach(o => write('<span class="o-cy">' + esc(o.name) + '</span> = "' + esc(sample(o.name)) + '"'));
  }
  function sample(n) {
    if (/alb|dns/.test(n)) return 'minha-app-prod-alb-1234567890.us-east-1.elb.amazonaws.com';
    if (/ecr/.test(n)) return '123456789012.dkr.ecr.us-east-1.amazonaws.com/minha-app/api';
    if (/lb_ip/.test(n)) return '34.117.42.8';
    if (/run/.test(n)) return 'https://minha-app-prod-abcdefg-rj.a.run.app';
    if (/vpc/.test(n)) return 'vpc-0a1b2c3d4e5f60718';
    return '(valor gerado no apply)';
  }

  function tfGraph() {
    const A2 = A(), g = H.graph(A2.blocks);
    if (!g.nodes.length) return write('<span class="o-dim">digraph { }</span>');
    let o = 'digraph {\n  compound = "true"\n  newrank = "true"\n  subgraph "root" {\n';
    g.edges.slice(0, 24).forEach(e => { o += '    "[root] ' + e.to + '" -> "[root] ' + e.from + '"\n'; });
    if (g.edges.length > 24) o += '    ... (' + (g.edges.length - 24) + ' arestas omitidas)\n';
    o += '  }\n}';
    write('<span class="o-dim">' + esc(o) + '</span>\n<span class="o-dim">Dica: </span><span class="o-cy">terraform graph | dot -Tsvg > grafo.svg</span><span class="o-dim"> — ou use a aba Diagrama aqui do lado.</span>');
  }

  function tfWorkspace(args) {
    const st = s();
    st.ws = st.ws || ['default'];
    st.wsCur = st.wsCur || 'default';
    if (args[0] === 'list' || !args[0]) { IAC.lab.save(); return write(st.ws.map(w => (w === st.wsCur ? '<span class="o-add">* ' + w + '</span>' : '  ' + w)).join('\n')); }
    if (args[0] === 'new') { if (st.ws.indexOf(args[1]) < 0) st.ws.push(args[1]); st.wsCur = args[1]; IAC.lab.save(); return write('<span class="o-add">Created and switched to workspace "' + esc(args[1]) + '"!</span>\n\n<span class="o-dim">Atenção: workspace compartilha o MESMO código. Para ambientes com diferenças reais\n(tamanho de máquina, conta, região), prefira diretórios separados.</span>'); }
    if (args[0] === 'select') { if (st.ws.indexOf(args[1]) < 0) return write('<span class="o-del">Workspace "' + esc(args[1]) + '" doesn\'t exist.</span>'); st.wsCur = args[1]; IAC.lab.save(); return write('Switched to workspace "' + esc(args[1]) + '".'); }
    return write('Usage: terraform workspace &lt;list|new|select|delete&gt;');
  }

  function tfImport(args) {
    const st = s();
    if (args.length < 2) return write('Usage: terraform import &lt;address&gt; &lt;id&gt;\n\n<span class="o-dim">Ex.: terraform import aws_ecr_repository.api minha-app/api</span>');
    const A2 = A(), b = H.graph(A2.blocks).byAddr[args[0]];
    if (!b) return write('<span class="o-del">Error: resource address "' + esc(args[0]) + '" does not exist in the configuration.</span>\n\n<span class="o-dim">O import só funciona se o bloco JÁ existe no código. Escreva o resource vazio primeiro.</span>');
    st.applied[args[0]] = { id: args[1] }; st.serial++; IAC.lab.save();
    write('<span class="o-hl">' + esc(args[0]) + '</span>: Importing from ID "' + esc(args[1]) + '"...');
    write('<span class="o-hl">' + esc(args[0]) + '</span>: Import prepared!\n  Prepared ' + esc(b.type) + ' for import');
    write('<span class="o-add">\nImport successful!</span>\n\nThe resources that were imported are shown above. These resources are now in\nyour Terraform state and will henceforth be managed by Terraform.');
    write('<span class="o-dim">\nAgora rode "terraform plan": tudo que ele quiser mudar é diferença entre o que\nexiste de verdade e o que você escreveu. Ajuste o código até o plan ficar limpo.</span>');
  }

  IAC.term = { render: render, write: write };
})(window.IAC);

  function proj(cloud) {

      has: cid => !!cnt[cid],
      count: cid => cnt[cid] || 0,
      cfg: cid => { const it = s.items.filter(x => x.cid === cid)[0]; return it ? L.cfgOf(it) : null; },

  function scenarioPage(sc) {

      'Em praticamente 100% dos casos é state/workspace/conta errados. <code>terraform state list</code>, <code>terraform workspace show</code> e <code>aws sts get-caller-identity</code> respondem em 10 segundos.'],
    ['Qual afirmação sobre o <code>.terraform.lock.hcl</code> está correta?',
      ['Não deve ir para o Git', 'Deve ir para o Git: trava a versão exata do provider', 'É gerado no apply', 'Guarda credenciais'], 1,
      'É o package-lock do Terraform. Sem ele comitado, sua máquina e o CI podem usar versões diferentes de provider e produzir planos diferentes.']

  function quizPage(view) {
    view.classList.remove('wide');
    const answers = {};
    render();
    view.addEventListener('click', function (e) {
      const o = e.target.closest('[data-q]');
      if (o) {
        const qi = +o.getAttribute('data-q'), oi = +o.getAttribute('data-o');
        if (answers[qi] !== undefined) return;
        answers[qi] = oi; render();
        return;
      }
      if (e.target.closest('[data-reset-quiz]')) { for (const k in answers) delete answers[k]; render(); }
    });
    function render() {
      const respondidas = Object.keys(answers).length;
      const certas = Object.keys(answers).filter(k => answers[k] === Q[k][2]).length;
      let html = '<div class="page"><span class="eyebrow">Fixação</span><h1>Quiz</h1>' +
        '<p class="lede">Quinze perguntas sobre as armadilhas que aparecem de verdade. Cada resposta traz a explicação — errar aqui é mais barato que errar em produção.</p>';
      html += '<div class="toolbar"><span class="chip ' + (certas === Q.length ? 'ok' : '') + '">' + certas + ' / ' + Q.length + ' corretas</span>' +
        '<span class="chip">' + respondidas + ' respondidas</span>' +
        '<span class="spacer"></span><button class="btn sm" data-reset-quiz>recomeçar</button></div>';
      html += '<div class="bar"><i style="width:' + Math.round(respondidas / Q.length * 100) + '%"></i></div>';
      Q.forEach((q, qi) => {
        html += '<div class="qz"><div class="qt">' + (qi + 1) + '. ' + q[0] + '</div>';
        q[1].forEach((opt, oi) => {
          let cls = '';
          if (answers[qi] !== undefined) {
            if (oi === q[2]) cls = ' right';
            else if (answers[qi] === oi) cls = ' wrong';
          }
          html += '<div class="opt' + cls + '" data-q="' + qi + '" data-o="' + oi + '">' +
            '<span class="mk">' + String.fromCharCode(97 + oi) + ')</span><span>' + opt + '</span></div>';
        });
        if (answers[qi] !== undefined) html += '<div class="expl">' + q[3] + '</div>';
        html += '</div>';
      });
      html += '</div>';
      view.innerHTML = html;
    }
  }

  IAC.section({
    id: 'lab', label: 'Roteiros & Quiz', icon: '🧪',

  });

/* ===== assets/js/app.js ===== */
/* =========================================================
   app.js — router, navegação, busca, tema
   ========================================================= */
(function (IAC) {
  'use strict';
  const $ = IAC.$, $$ = IAC.$$, esc = IAC.esc;
  let flat = [], searchIndex = null, current = null;

  /* ---------------- boot ---------------- */
  function boot() {
    IAC.lab.load();
    flat = IAC.flat();
    applyTheme(pickTheme());
    buildNav();
    window.addEventListener('hashchange', route);
    bindGlobal();
    route();
  }

  /* ---------------- navegação ---------------- */
  function buildNav() {
    const nav = $('#nav');
    const collapsed = IAC.store.get('navCollapsed', {});
    let html = '';
    IAC.sections.forEach(sec => {
      const isC = !!collapsed[sec.id];
      html += '<div class="nav-sec' + (isC ? ' collapsed' : '') + '" data-sec="' + sec.id + '"' +
        (sec.cloud ? ' data-cloud="' + sec.cloud + '"' : '') + '>' +
        '<button class="nav-sec-h"><span class="dot"></span>' + esc(sec.label) +
        '<svg viewBox="0 0 24 24" class="ico chev"><path d="M6 9l6 6 6-6"/></svg></button><div class="nav-items">';
      sec.pages.forEach(p => {
        const path = sec.id + '/' + p.id;
        html += '<a class="nav-item" href="#/' + path + '" data-path="' + path + '">' +
          '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.title) + '</span>' +
          (p.tag ? '<span class="tag lab">' + esc(p.tag) + '</span>' :
            '<svg viewBox="0 0 24 24" class="ico tick"><path d="M20 6L9 17l-5-5"/></svg>') +
          '</a>';
      });
      html += '</div></div>';
    });
    nav.innerHTML = html;
    refreshNavState();
  }

  function refreshNavState() {
    const done = IAC.doneSet();
    $$('#nav .nav-item').forEach(a => {
      const p = a.getAttribute('data-path');
      a.classList.toggle('done', !!done[p]);
      a.classList.toggle('active', p === current);
    });
    const total = flat.filter(p => !p.mount).length;
    const d = Object.keys(done).length;
    $('#progressPill').textContent = d + '/' + total + ' lidos';
  }

  /* ---------------- router ---------------- */
  /** Substitui #view por um clone vazio: descarta todos os listeners que
   *  páginas interativas (lab, roteiros, quiz) tenham registrado nele. */
  function freshView() {
    const old = $('#view');
    const nu = old.cloneNode(false);
    nu.className = 'view';
    old.parentNode.replaceChild(nu, old);
    return nu;
  }

  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const path = h || 'fund/por-que';
    const page = IAC.pageIndex[path];
    const view = freshView();
    $('#q').value = '';
    if (!page) { location.hash = '#/fund/por-que'; return; }
    current = path;
    view.classList.remove('wide');
    view.scrollTop = 0;
    window.scrollTo(0, 0);
    $('#crumb').innerHTML = '<b>' + esc(page.section.label) + '</b><span class="sep">›</span>' + esc(page.title);
    document.title = page.title + ' · Handbook IaC';
    if (page.mount) { view.innerHTML = ''; page.mount(view); }
    else {
      let html = '<div class="page">' + page.body() + markDone(path) + pager(path) + '</div>';
      view.innerHTML = html;
      buildToc();
    }
    refreshNavState();
    closeSidebar();
  }

  function markDone(path) {
    const d = IAC.isDone(path);
    return '<div class="mark-done' + (d ? ' done' : '') + '" data-done="' + path + '">' +
      '<svg viewBox="0 0 24 24" class="ico" style="color:' + (d ? 'var(--ok)' : 'var(--tx-3)') + '">' +
      (d ? '<path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14.1l-3-3"/>' : '<circle cx="12" cy="12" r="9"/>') +
      '</svg><span>' + (d ? 'Capítulo concluído' : 'Marcar capítulo como lido') + '</span></div>';
  }

  function pager(path) {
    const list = flat.map(p => p.section.id + '/' + p.id);
    const i = list.indexOf(path);
    const prev = i > 0 ? IAC.pageIndex[list[i - 1]] : null;
    const next = i < list.length - 1 ? IAC.pageIndex[list[i + 1]] : null;
    let h = '<div class="pager">';
    h += prev ? '<a href="#/' + list[i - 1] + '"><div class="k">← anterior</div><div class="n">' + esc(prev.title) + '</div></a>' : '<span style="flex:1"></span>';
    h += next ? '<a class="r" href="#/' + list[i + 1] + '"><div class="k">próximo →</div><div class="n">' + esc(next.title) + '</div></a>' : '<span style="flex:1"></span>';
    return h + '</div>';
  }

  function buildToc() {
    const hs = $$('#view h2');
    if (hs.length < 3) return;
    let h = '<div class="tocx">';
    hs.forEach((el, i) => {
      const id = 'h' + i + '-' + IAC.slug(el.textContent).slice(0, 30);
      el.id = id;
      h += '<a href="#' + id + '" data-anchor="' + id + '">' + esc(el.textContent) + '</a>';
    });
    h += '</div>';
    const lede = $('#view .lede') || $('#view h1');
    if (lede) lede.insertAdjacentHTML('afterend', h);
  }

  /* ---------------- busca ---------------- */
  function buildIndex() {
    if (searchIndex) return searchIndex;
    searchIndex = [];
    flat.forEach(p => {
      let txt = p.title;
      if (p.body) { try { txt += ' ' + IAC.stripTags(p.body()); } catch (e) { } }
      searchIndex.push({ p: p, path: p.section.id + '/' + p.id, txt: txt, low: txt.toLowerCase() });
    });
    // recursos dos catálogos entram na busca também
    [['aws', IAC.awsRes], ['gcp', IAC.gcpRes]].forEach(pair => {
      pair[1].forEach(d => {
        searchIndex.push({
          res: d, cloud: pair[0], path: pair[0] + '/lab',
          txt: d.name + ' ' + d.tf + ' ' + IAC.stripTags(d.desc),
          low: (d.name + ' ' + d.tf + ' ' + IAC.stripTags(d.desc)).toLowerCase()
        });
      });
    });
    return searchIndex;
  }

  function doSearch(q) {
    if (!q || q.length < 2) { route(); return; }
    const view = freshView();
    const idx = buildIndex();
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    idx.forEach(it => {
      let score = 0, all = true;
      terms.forEach(t => {
        const i = it.low.indexOf(t);
        if (i < 0) { all = false; return; }
        score += 1;
        if ((it.res ? it.res.name : it.p.title).toLowerCase().indexOf(t) >= 0) score += 6;
      });
      if (all) hits.push({ it: it, score: score, pos: it.low.indexOf(terms[0]) });
    });
    hits.sort((a, b) => b.score - a.score);
    view.classList.remove('wide');
    let html = '<div class="page"><span class="eyebrow">Busca</span><h1>' + hits.length + ' resultado' + (hits.length === 1 ? '' : 's') + ' para "' + esc(q) + '"</h1>';
    if (!hits.length) html += '<div class="empty"><div class="big">🔍</div>Nada encontrado. Tente <code>target group</code>, <code>drift</code>, <code>for_each</code>, <code>state</code>…</div>';
    hits.slice(0, 40).forEach(hh => {
      const it = hh.it;
      const snip = snippet(it.txt, terms[0]);
      if (it.res) {
        html += '<a class="card link" style="display:block;margin-bottom:9px" href="#/' + it.path + '">' +
          '<div class="k">' + it.cloud.toUpperCase() + ' · componente do laboratório</div>' +
          '<div style="font-weight:650;margin:2px 0">' + it.res.em + ' ' + esc(it.res.name) + ' <code>' + esc(it.res.tf) + '</code></div>' +
          '<div style="font-size:12.5px;color:var(--tx-3)">' + snip + '</div></a>';
      } else {
        html += '<a class="card link" style="display:block;margin-bottom:9px" href="#/' + it.path + '">' +
          '<div class="k">' + esc(it.p.section.label) + '</div>' +
          '<div style="font-weight:650;margin:2px 0">' + esc(it.p.title) + '</div>' +
          '<div style="font-size:12.5px;color:var(--tx-3)">' + snip + '</div></a>';
      }
    });
    html += '</div>';
    view.innerHTML = html;
    $('#crumb').innerHTML = '<b>Busca</b><span class="sep">›</span>' + esc(q);
  }
  function snippet(txt, term) {
    const i = txt.toLowerCase().indexOf(term);
    if (i < 0) return esc(txt.slice(0, 150)) + '…';
    const s = Math.max(0, i - 60);
    const part = txt.slice(s, s + 190);
    return (s > 0 ? '…' : '') + esc(part).replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'),
      '<mark style="background:rgba(123,66,188,.35);color:inherit;border-radius:3px">$1</mark>') + '…';
  }

  /* ---------------- paleta (Ctrl+K) ---------------- */
  function openPalette() {
    const pal = $('#palette'); pal.classList.remove('hidden');
    const inp = $('#paletteInput'); inp.value = ''; inp.focus();
    renderPalette('');
  }
  function closePalette() { $('#palette').classList.add('hidden'); }
  function renderPalette(q) {
    const list = $('#paletteList');
    const ql = q.toLowerCase();
    const items = flat.filter(p => !ql || (p.title + ' ' + p.section.label).toLowerCase().indexOf(ql) >= 0).slice(0, 12);
    list.innerHTML = items.map((p, i) =>
      '<div class="presult' + (i === 0 ? ' sel' : '') + '" data-go="' + p.section.id + '/' + p.id + '">' +
      '<span>' + esc(p.title) + '</span><span class="sec">' + esc(p.section.label) + '</span></div>').join('') ||
      '<div class="presult"><span style="color:var(--tx-3)">nada encontrado</span></div>';
  }

  /* ---------------- tema ---------------- */
  /** Escolha do usuário > tema já aplicado na página > preferência do sistema. */
  function pickTheme() {
    const saved = IAC.store.get('theme', null);
    if (saved) return saved;
    const attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light' || attr === 'dark') return attr;
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    } catch (e) { }
    return 'dark';
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    IAC.store.set('theme', t);
  }

  function closeSidebar() { $('#sidebar').classList.remove('open'); }

  /* ---------------- eventos globais ---------------- */
  function bindGlobal() {
    document.addEventListener('click', function (e) {
      const cp = e.target.closest('[data-copy]');
      if (cp) { IAC.copy(IAC.getCode(cp.getAttribute('data-copy')), 'Código copiado'); return; }

      const secH = e.target.closest('.nav-sec-h');
      if (secH) {
        const sec = secH.parentNode; sec.classList.toggle('collapsed');
        const c = IAC.store.get('navCollapsed', {});
        c[sec.getAttribute('data-sec')] = sec.classList.contains('collapsed');
        IAC.store.set('navCollapsed', c); return;
      }

      const md = e.target.closest('[data-done]');
      if (md) {
        const on = IAC.toggleDone(md.getAttribute('data-done'));
        md.classList.toggle('done', on);
        md.querySelector('span').textContent = on ? 'Capítulo concluído' : 'Marcar capítulo como lido';
        md.querySelector('svg').style.color = on ? 'var(--ok)' : 'var(--tx-3)';
        md.querySelector('svg').innerHTML = on
          ? '<path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14.1l-3-3"/>'
          : '<circle cx="12" cy="12" r="9"/>';
        refreshNavState(); return;
      }

      const anchor = e.target.closest('[data-anchor]');
      if (anchor) {
        e.preventDefault();
        const el = document.getElementById(anchor.getAttribute('data-anchor'));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      const go = e.target.closest('[data-go]');
      if (go) { location.hash = '#/' + go.getAttribute('data-go'); closePalette(); return; }

      if (e.target.closest('#themeBtn')) {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        return;
      }
      if (e.target.closest('#resetBtn')) {
        if (!confirm('Apagar progresso de leitura, projetos do laboratório e preferências?')) return;
        ['done', 'lab.aws', 'lab.gcp', 'navCollapsed'].forEach(k => IAC.store.del(k));
        IAC.lab.load(); location.reload(); return;
      }
      if (e.target.closest('#menuBtn')) { $('#sidebar').classList.toggle('open'); return; }
      if (e.target === $('#palette')) { closePalette(); return; }
      if (e.target.closest('.sidebar') === null && $('#sidebar').classList.contains('open') && !e.target.closest('#menuBtn')) closeSidebar();
    });

    $('#prevBtn').addEventListener('click', () => step(-1));
    $('#nextBtn').addEventListener('click', () => step(1));

    $('#q').addEventListener('input', IAC.debounce(function () { doSearch($('#q').value.trim()); }, 220));
    $('#q').addEventListener('keydown', function (e) { if (e.key === 'Escape') { this.value = ''; route(); this.blur(); } });

    $('#paletteInput').addEventListener('input', function () { renderPalette(this.value); });
    $('#paletteInput').addEventListener('keydown', function (e) {
      if (e.key === 'Escape') return closePalette();
      const items = $$('#paletteList .presult');
      let i = items.findIndex(x => x.classList.contains('sel'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (i >= 0) items[i].classList.remove('sel');
        i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items[i].classList.add('sel'); items[i].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        const sel = items[Math.max(0, i)];
        if (sel && sel.getAttribute('data-go')) { location.hash = '#/' + sel.getAttribute('data-go'); closePalette(); }
      }
    });

    document.addEventListener('keydown', function (e) {
      const inField = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''));
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
      if (inField) return;
      if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
      if (e.key === 'ArrowLeft' && e.altKey) step(-1);
      if (e.key === 'ArrowRight' && e.altKey) step(1);
      if (e.key === 't' && !e.metaKey && !e.ctrlKey) applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  function step(d) {
    const list = flat.map(p => p.section.id + '/' + p.id);
    const i = list.indexOf(current);
    const n = i + d;
    if (n >= 0 && n < list.length) location.hash = '#/' + list[n];
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.IAC);

</script>
</body>
